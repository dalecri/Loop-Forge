<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0e10">
<title>GBX-16</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// Old Loop Forge share links (#s=...) now open the archived Loop Forge.
if (/[#&]s=/.test(location.hash)) location.replace('archive/loop-forge/' + location.hash);
</script>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --silk:#7d8088; --ink:#d6d8dd;
  --amber:#ffa94d; --oled:#9ff3ff;
  --pad:520px;
}
*{box-sizing:border-box;}
html,body{
  height:100%; margin:0; color:var(--ink); font-family:var(--ui);
  background:radial-gradient(120% 80% at 50% 0%,#2a2c31 0%,#121315 60%,#0b0b0d 100%);
  overflow:hidden; overscroll-behavior:none; -webkit-font-smoothing:antialiased;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
button{font:inherit; color:inherit; border:none; background:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent;}

/* ---------- chassis ---------- */
.device{
  position:relative; height:100vh; height:100dvh;
  display:flex; flex-direction:column; gap:14px;
  padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#34363c 0%,#26272b 35%,#1d1e21 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.7);
}
.screw{position:absolute; width:11px; height:11px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9a9da3,#4b4d52 60%,#2a2b2e);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.08);}
.screw::after{content:''; position:absolute; left:2px; right:2px; top:5px; height:1.5px; background:#26272a; transform:rotate(35deg);}
.screw.tl{left:6px; top:6px}.screw.tr{right:6px; top:6px}.screw.bl{left:6px; bottom:6px}.screw.br{right:6px; bottom:6px}

.well{
  background:linear-gradient(180deg,#121315,#17181b);
  border-radius:16px;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.75), inset 0 0 0 1px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.07);
}
.silk{font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--silk); white-space:nowrap;}
.silk b{color:var(--ink); font-family:var(--mono); font-weight:500; letter-spacing:0; margin-left:4px;}

/* ---------- rubber buttons + LEDs ---------- */
.btn{
  position:relative; border-radius:11px; color:#c9cbd0;
  background:linear-gradient(180deg,#3d3f45,#2b2c30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.11), inset 0 -1px 2px rgba(0,0,0,.35), 0 2px 0 #0d0e10, 0 4px 8px rgba(0,0,0,.5);
  transition:transform .06s ease, box-shadow .06s ease, background .15s ease;
  touch-action:none;
}
.btn:active,.btn.down{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -1px 2px rgba(0,0,0,.35), 0 0 0 #0d0e10, 0 1px 3px rgba(0,0,0,.5);}
.led{display:block; width:7px; height:7px; border-radius:50%; background:#2a2523; box-shadow:inset 0 1px 1px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06); transition:background .12s, box-shadow .12s;}
.led.g.on{background:#62ff95; box-shadow:0 0 6px #62ff95, 0 0 14px rgba(98,255,149,.5);}
.led.r.on{background:#ff4d4d; box-shadow:0 0 6px #ff4d4d, 0 0 14px rgba(255,77,77,.5);}
.led.a.on{background:var(--amber); box-shadow:0 0 6px var(--amber), 0 0 14px rgba(255,169,77,.5);}
.led.blink{animation:blink .5s steps(2,start) infinite;}
@keyframes blink{to{visibility:hidden}}

.top{display:flex; align-items:center; gap:20px;}
.grp{display:flex; gap:10px;}
.tb{width:70px; height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;}
.tb .led{position:absolute; top:7px; right:8px;}
.tb svg{width:20px; height:20px; fill:#d6d8dd;}
.tb .silk{font-size:8.5px;}

.fader{flex:1 1 220px; max-width:360px; display:flex; flex-direction:column; gap:8px;}
.fader .silk{display:flex; justify-content:space-between;}
.range{
  -webkit-appearance:none; appearance:none; width:100%; height:44px; margin:0; background:transparent; touch-action:none; cursor:pointer;
}
.range::-webkit-slider-runnable-track{height:8px; border-radius:4px; background:#0c0d0e; box-shadow:inset 0 1px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08);}
.range::-moz-range-track{height:8px; border-radius:4px; background:#0c0d0e;}
.range::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:30px; height:42px; margin-top:-17px; border-radius:6px;
  background:linear-gradient(90deg,transparent 46%,#2b2c2f 46% 54%,transparent 54%),linear-gradient(180deg,#e4e6ea,#a8abb1 45%,#8b8e94 55%,#c4c7cc);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 6px rgba(0,0,0,.6), 0 1px 0 #111;
}
.range::-moz-range-thumb{width:30px; height:42px; border:none; border-radius:6px; background:linear-gradient(180deg,#e4e6ea,#8b8e94);}

/* knobs: LED arc ring + machined cap */
.kn{display:flex; flex-direction:column; align-items:center; gap:7px;}
.knob{
  --sz:58px; width:var(--sz); height:var(--sz); border-radius:50%; position:relative; touch-action:none; cursor:ns-resize;
  background:conic-gradient(from 225deg,#1b1c1f 0 var(--a0,0deg),var(--amber) var(--a0,0deg) var(--a1,0deg),#1b1c1f var(--a1,0deg) 270deg,transparent 270deg);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.8);
}
.knob.big{--sz:76px;}
.knob .cap{
  position:absolute; inset:6px; border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,transparent 58%,rgba(0,0,0,.25) 59% 61%,transparent 62%),
    conic-gradient(from 20deg,#8d9096,#d9dce0,#7c7f85,#c7cacf,#8d9096,#e0e2e6,#7f8288,#cfd2d6,#8d9096);
  box-shadow:0 0 0 2px #121315, 0 4px 8px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.6);
}
.knob i{position:absolute; left:50%; top:6px; width:3px; height:30%; margin-left:-1.5px; border-radius:2px; background:#1b1c1f;
  transform-origin:50% calc(var(--sz) / 2 - 12px); transform:rotate(var(--r,-135deg));}
.knob.grab .cap{box-shadow:0 0 0 2px #121315, 0 2px 4px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.6);}

.chip{height:64px; padding:0 18px; display:flex; align-items:center; gap:9px; font-size:11px; font-weight:700; letter-spacing:.12em;}
#tape{margin-left:auto;}
.chip.arm{color:var(--amber);}

/* ---------- pads ---------- */
.main{flex:1 1 auto; min-height:0; display:flex; gap:20px;}
.padwell{padding:12px; flex:none; align-self:flex-start;}
.pads{width:var(--padw,var(--pad)); height:var(--padh,var(--pad)); display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:clamp(8px,1.5vmin,13px);}
.pad{
  --c:var(--amber);
  position:relative; border-radius:13px; text-align:left; touch-action:none;
  background:linear-gradient(180deg,#3a3c42 0%,#2d2e33 60%,#28292d 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -2px 4px rgba(0,0,0,.35), 0 2px 0 #0b0c0d, 0 5px 10px rgba(0,0,0,.55);
  transition:transform .05s ease, box-shadow .05s ease;
}
.pad::after{content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 26%,transparent), inset 0 0 18px color-mix(in srgb,var(--c) 9%,transparent);}
.pad.sel::before{content:''; position:absolute; inset:-5px; border-radius:17px; pointer-events:none; box-shadow:0 0 0 1.5px rgba(255,255,255,.55);}
.pad.down{transform:translateY(2px) scale(.985); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 2px rgba(0,0,0,.35), 0 0 0 #0b0c0d, 0 2px 4px rgba(0,0,0,.5);}
.pad .glow{position:absolute; inset:0; border-radius:inherit; opacity:0; pointer-events:none;
  background:radial-gradient(90% 90% at 50% 45%,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 50%,color-mix(in srgb,var(--c) 75%,#000) 100%);
  box-shadow:0 0 26px 3px color-mix(in srgb,var(--c) 55%,transparent);}
.pad.down .glow{opacity:1;}
.pad .nm{position:absolute; left:12px; right:10px; bottom:10px; font-size:clamp(9.5px,1.3vmin,12px); font-weight:700; letter-spacing:.1em; color:#9b9ea6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pad .nt{position:absolute; left:12px; top:10px; font-family:var(--mono); font-size:clamp(10px,1.3vmin,12px); color:#7d8088;}
.pad.down .nm,.pad.down .nt{color:rgba(0,0,0,.65);}
.pad .dot{position:absolute; right:11px; top:11px; width:6px; height:6px; border-radius:50%; background:#1a1b1d; box-shadow:inset 0 1px 1px rgba(0,0,0,.8);}
.pad.has .dot{background:var(--c); box-shadow:0 0 6px var(--c);}

/* ---------- side: OLED + controls + bank ---------- */
.side{flex:1 1 auto; min-width:300px; display:flex; flex-direction:column; gap:16px; min-height:0;}
.ed{display:flex; flex-direction:column; gap:16px;}
.lcd{
  position:relative; border-radius:12px; padding:14px 18px; overflow:hidden; font-family:var(--mono); color:var(--oled);
  background:linear-gradient(180deg,#07090a,#040505);
  box-shadow:inset 0 0 0 1px #000, inset 0 3px 10px rgba(0,0,0,.95), 0 0 0 5px #17181b, 0 0 0 6px rgba(255,255,255,.06);
  text-shadow:0 0 8px rgba(159,243,255,.45);
}
.lcd::before{content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 38%);}
.lcd .r{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; letter-spacing:.06em; opacity:.8;}
.lcd .big{font-size:clamp(20px,3vmin,28px); font-weight:600; letter-spacing:.04em; margin:6px 0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:1;}
.lcd .flag{opacity:.18;}
.lcd .flag.on{opacity:1; color:#ff6b6b; text-shadow:0 0 8px rgba(255,107,107,.6);}

.ctrls{display:flex; align-items:center; gap:14px; flex-wrap:nowrap;}
.sq{width:54px; height:64px; display:flex; align-items:center; justify-content:center;}
.sq svg{width:18px; height:18px;}
.arrows{display:flex; gap:8px;}

.bank{flex:1; min-height:150px; padding:14px; display:flex; flex-direction:column; gap:12px;}
.bank .hd{display:flex; justify-content:space-between; align-items:center;}
.modes{display:flex; gap:8px;}
.mode{height:38px; padding:0 13px; display:flex; align-items:center; gap:7px; font-size:10px; font-weight:700; letter-spacing:.12em;}
.mode.on{color:#fff;}
.kn .silk b{display:inline-block; min-width:3ch;}
#flt + .silk b{min-width:4.6ch;}
.pad.muted::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);}
.pad.muted .nm,.pad.muted .nt{color:#55585f;}
.pad.muted .dot{background:#ff4d4d; box-shadow:0 0 6px #ff4d4d;}
.pad.muted{background:linear-gradient(180deg,#2e3035,#24252a);}
.pad.tap{transform:translateY(2px) scale(.985);}
.steps.muted .cell.on::before{background:#6a6c72; box-shadow:none;}
.pat.flash .led{background:#fff!important; box-shadow:0 0 10px #fff!important;}
.brand{font-size:11px; font-weight:800; letter-spacing:.28em; color:#5d6068; font-style:italic;}
.pats{flex:1; display:flex; gap:10px;}
.pat{flex:1; min-height:72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:17px; font-weight:700;}
.pat.cur{color:#fff;}

/* ---------- steps ---------- */
.seq{display:flex; gap:12px; padding:12px; align-items:stretch;}
.steps{flex:1; display:flex; flex-direction:column; gap:8px; touch-action:none; --c:var(--amber);}
.srow{display:flex; gap:14px;}
.sgrp{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
.cell{
  position:relative; height:56px; border-radius:9px;
  background:linear-gradient(180deg,#393b41,#2a2b2f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 2px 0 #0b0c0d, 0 3px 6px rgba(0,0,0,.45);
  transition:background .08s;
}
.steps.two .cell{height:42px;}
.cell::before{content:''; position:absolute; left:22%; right:22%; top:8px; height:4px; border-radius:2px; background:#1c1a1a; box-shadow:inset 0 1px 1px rgba(0,0,0,.8);}
.cell.beat::after{content:''; position:absolute; left:50%; bottom:7px; width:3px; height:3px; margin-left:-1.5px; border-radius:50%; background:#5c5f66;}
.cell.on::before{background:var(--c); box-shadow:0 0 6px var(--c), 0 0 14px color-mix(in srgb,var(--c) 50%,transparent);}
.cell.ph{background:linear-gradient(180deg,#4a4c53,#36383d);}
.cell.on.ph{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 35%,#4a4c53),color-mix(in srgb,var(--c) 20%,#2d2e33));}
.len{display:flex; flex-direction:column; gap:8px; width:60px;}
.len button{flex:1; min-height:24px; font-size:11px; font-weight:700; letter-spacing:.08em; display:flex; align-items:center; justify-content:center; gap:6px;}
.len button.cur{color:#fff;}

@media (orientation:portrait){
  .top{flex-wrap:wrap; gap:14px;}
  .main{flex-direction:column; align-items:center; justify-content:center;}
  .padwell{align-self:center;}
  .side{width:100%; flex:none; flex-direction:row; min-width:0;}
  .ed{flex:1.35;}
  .bank{margin-top:0; flex:1;}
  .bank .pats{flex:1;}
  .pat{height:auto;}
}
/* compact: short screens (iPad mini landscape, Safari toolbars) */
@media (max-height:780px){
  .device{gap:10px; padding-top:max(12px,env(safe-area-inset-top)); padding-bottom:max(12px,env(safe-area-inset-bottom));}
  .tb{height:54px; width:64px;} .chip{height:54px;}
  .knob{--sz:50px;} .knob.big{--sz:66px;}
  .sq{height:56px; width:50px;}
  .cell{height:46px;} .steps.two .cell{height:34px;}
  .seq{padding:10px;} .padwell{padding:10px;}
  .lcd{padding:11px 16px;} .lcd .big{margin:4px 0 6px;}
  .ed{gap:12px;} .side{gap:12px;}
}
/* narrow: iPad mini portrait */
@media (max-width:820px){
  .top{flex-wrap:nowrap; gap:12px;}
  .fader{flex:1 1 110px; min-width:100px;}
  .chip{padding:0 13px; gap:7px; letter-spacing:.08em;}
  .tb{width:60px;}
  .knob{--sz:50px;} .knob.big{--sz:62px;}
  .ctrls{gap:10px; flex-wrap:nowrap;}
  .sq{width:46px;} .arrows{gap:6px;}
  .srow{gap:10px;} .sgrp{gap:5px;}
  .len{width:52px;}
}
@media (max-width:820px) and (max-height:1100px){
  .cell{height:46px;} .steps.two .cell{height:34px;}
  .device{gap:10px;}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="device">
  <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
  <header class="top">
    <div class="grp">
      <button id="play" class="btn tb" aria-label="Play"><span class="led g" id="playled"></span><svg viewBox="0 0 24 24"><path id="playicon" d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg><span class="silk">Play</span></button>
      <button id="rec" class="btn tb" aria-label="Record"><span class="led r" id="recled"></span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg><span class="silk">Rec</span></button>
    </div>
    <div class="fader">
      <div class="silk"><span>Tempo</span><b id="bpmv">96</b></div>
      <input id="bpm" class="range" type="range" min="60" max="180" step="1" value="96" aria-label="Tempo">
    </div>
    <div class="kn"><div class="knob" id="swing" role="slider" aria-label="Swing"><div class="cap"></div><i></i></div><div class="silk">Swing<b class="kv"></b></div></div>
    <div class="kn"><div class="knob" id="flt" role="slider" aria-label="Filter"><div class="cap"></div><i></i></div><div class="silk">Filter<b class="kv"></b></div></div>
    <div class="kn"><div class="knob" id="mst" role="slider" aria-label="Master volume"><div class="cap"></div><i></i></div><div class="silk">Master<b class="kv"></b></div></div>
    <button id="tape" class="btn chip"><span class="led r" id="tapeled"></span><span id="tapet">TAPE</span></button>
    <button id="clr" class="btn chip"><span class="led a" id="clrled"></span><span id="clrt">CLEAR</span></button>
  </header>

  <main class="main" id="main">
    <div class="well padwell"><div class="pads" id="pads"></div></div>
    <aside class="side" id="side">
      <div class="ed">
        <div class="lcd">
          <div class="r"><span id="lpad">PAD 01</span><span><span class="flag" id="lrec">&#9679; REC</span>&nbsp;&nbsp;<span id="lpat">A</span></span></div>
          <div class="r big" id="lsound">KICK</div>
          <div class="r"><span><span id="lbpm">96</span> BPM</span><span id="lpos">-.-</span></div>
        </div>
        <div class="ctrls">
          <div class="arrows">
            <button id="prev" class="btn sq" aria-label="Previous sound"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#d6d8dd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button id="next" class="btn sq" aria-label="Next sound"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="#d6d8dd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div class="kn"><div class="knob big" id="vol" role="slider" aria-label="Pad volume"><div class="cap"></div><i></i></div><div class="silk">Volume<b class="kv"></b></div></div>
          <div class="kn"><div class="knob big" id="pit" role="slider" aria-label="Pad pitch"><div class="cap"></div><i></i></div><div class="silk">Pitch<b class="kv"></b></div></div>
          <button id="load" class="btn chip"><span id="loadt">LOAD</span></button>
        </div>
      </div>
      <div class="well bank">
        <div class="hd"><span class="silk">Pattern</span><div class="modes"><button id="mute" class="btn mode"><span class="led r" id="muteled"></span>MUTE</button><button id="copy" class="btn mode"><span class="led a" id="copyled"></span>COPY</button></div></div>
        <div class="pats" id="pats"></div>
      </div>
    </aside>
  </main>

  <footer class="well seq">
    <div class="steps" id="steps"></div>
    <div class="len" id="len"><button class="btn" data-l="16">16</button><button class="btn" data-l="32">32</button></div>
  </footer>
</div>
<input id="file" type="file" accept="audio/*" hidden>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
/* ================= AUDIO CORE ================= */
const AC = window.AudioContext || window.webkitAudioContext;
const ctx = new AC({ latencyHint: 'interactive' });
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

const master = ctx.createGain();
const comp = ctx.createDynamicsCompressor();
comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 4;
comp.attack.value = 0.003; comp.release.value = 0.18;
const lpf = ctx.createBiquadFilter(), hpf = ctx.createBiquadFilter();
lpf.type = 'lowpass'; lpf.frequency.value = 20000; lpf.Q.value = 0.9;
hpf.type = 'highpass'; hpf.frequency.value = 10; hpf.Q.value = 0.9;
master.connect(lpf); lpf.connect(hpf); hpf.connect(comp); comp.connect(ctx.destination);
let filterAmt = 0; // -50 (low-pass) .. 0 (off) .. +50 (high-pass); not saved, always opens clean
function setFilter(v) {
  filterAmt = v;
  const t = ctx.currentTime, x = Math.abs(v) / 50;
  const lf = v < 0 ? 20000 * Math.pow(2, -x * 7.5) : 20000;
  const hf = v > 0 ? 20 * Math.pow(2, x * 9) : 10;
  lpf.frequency.setTargetAtTime(lf, t, 0.02); hpf.frequency.setTargetAtTime(hf, t, 0.02);
  lpf.Q.setTargetAtTime(v < 0 ? 0.9 + x * 4 : 0.9, t, 0.02); hpf.Q.setTargetAtTime(v > 0 ? 0.9 + x * 4 : 0.9, t, 0.02);
}

// iOS: resume + play a silent buffer inside the first gesture.
let unlocked = false;

  } });
const swK = knob($('swing'), { min: 0, max: 100, def: 0, get: () => S.swing, set: v => { S.swing = v; } });
const fltK = knob($('flt'), { min: -50, max: 50, def: 0, bi: true, fmt: v => v === 0 ? 'OFF' : (v < 0 ? 'LP' : 'HP') + Math.abs(v),
  get: () => filterAmt, set: v => setFilter(v) });
const mstK = knob($('mst'), { min: 0, max: 100, def: 80, get: () => S.master, set: v => { S.master = v; applyGains(); } });

/* OLED */
function lcd() {
  const p = S.pads[S.sel];
  $('lpad').textContent = 'PAD ' + String(S.sel + 1).padStart(2, '0');
  $('lsound').textContent = fullName(p);
  $('lbpm').textContent = S.bpm;
  $('lpat').textContent = 'ABCD'[S.cur] + (pending !== null ? ' > ' + 'ABCD'[pending] : '');
  $('lrec').classList.toggle('on', recArm);
}
function lcdPos(s) { $('lpos').textContent = s < 0 ? '-.-' : (Math.floor(s / 4) + 1) + '.' + (s % 4 + 1); }

function renderEditor() {
  lcd(); volK.render(); pitK.render();
  stepsEl.style.setProperty('--c', catColor(S.pads[S.sel]));
  stepsEl.classList.toggle('muted', !!S.mutes[S.sel]);
}
function renderModes() {
  $('mute').classList.toggle('on', muteMode); $('muteled').classList.toggle('on', muteMode || S.mutes.some(Boolean));
  $('muteled').classList.toggle('blink', muteMode);
  $('copy').classList.toggle('on', copyMode); $('copyled').classList.toggle('on', copyMode); $('copyled').classList.toggle('blink', copyMode);
}
$('mute').addEventListener('click', () => { muteMode = !muteMode; copyMode = false; renderModes(); });
$('copy').addEventListener('click', () => { copyMode = !copyMode; muteMode = false; renderModes(); });
function soundList(i) { const l = SOUNDS.map(s => s[0]); if (samples[i]) l.push('sample'); return l; }
function cycle(dir) {
  const p = S.pads[S.sel], l = soundList(S.sel);
  let k = l.indexOf(p.sound); k = (k + dir + l.length) % l.length;
  p.sound = l[k]; save(); renderEditor(); renderPads();
  unlock(); trigger(S.sel, ctx.currentTime); flash(S.sel);
}
$('prev').addEventListener('click', () => cycle(-1));
$('next').addEventListener('click', () => cycle(1));

$('bpm').addEventListener('input', () => { S.bpm = +$('bpm').value; $('bpmv').textContent = S.bpm; lcd(); save(); });

/* transport */
$('play').addEventListener('click', () => playing ? stop() : start());
$('rec').addEventListener('click', () => { recArm = !recArm; if (recArm && !playing) start(); renderTransport(); });
function renderTransport() {
  $('playled').classList.toggle('on', playing);
  $('playicon').setAttribute('d', playing ? 'M6 6h12v12H6z' : 'M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z');
  $('recled').classList.toggle('on', recArm);
  if (!playing) lcdPos(-1);
  lcd();
}

/* pattern bank */
'ABCD'.split('').forEach((L, i) => {
  const b = document.createElement('button'); b.className = 'btn pat'; b.dataset.i = i;
  b.innerHTML = '<span class="led a"></span><span>' + L + '</span>';
  b.addEventListener('click', () => {
    unlock();
    if (copyMode) {
      copyMode = false; renderModes();
      if (i === S.cur) return;
      S.patterns[i] = JSON.parse(JSON.stringify(pat())); save(); renderPats();
      b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 220);
      return;
    }
    if (!playing) { S.cur = i; pending = null; save(); }
    else pending = (i === S.cur) ? null : i;
    renderPats(); renderSteps(); renderPads(); lcd();
  });
  patsEl.appendChild(b);
});
function renderPats() {
  [...patsEl.children].forEach((b, i) => {
    const P = S.patterns[i], led = b.firstChild;
    const has = P.steps.some(r => r.slice(0, P.len).some(Boolean));
    b.classList.toggle('cur', i === S.cur);
    led.classList.toggle('on', i === S.cur || i === pending);
    led.classList.toggle('blink', i === pending);
    led.style.opacity = (i === S.cur || i === pending || has) ? 1 : .55;
  });
  lcd();
}

/* clear: tap twice */
let clrT = 0, clrArm = false;
$('clr').addEventListener('click', () => {
  if (clrArm) {
    clearTimeout(clrT); clrArm = false;
    pat().steps = emptySteps(); skip.clear(); save(); renderSteps(); renderPads(); renderPats();
  } else {
    clrArm = true; clrT = setTimeout(() => { clrArm = false; clrUI(); }, 2200);
  }
  clrUI();
});
function clrUI() {
  $('clrt').textContent = clrArm ? 'SURE?' : 'CLEAR';
  $('clrled').classList.toggle('on', clrArm); $('clrled').classList.toggle('blink', clrArm);
  $('clr').classList.toggle('arm', clrArm);
}

/* steps */
let cells = [], phIdx = -1;
function renderSteps() {
  const p = pat(), row = p.steps[S.sel];
  stepsEl.classList.toggle('two', p.len === 32);
  if (cells.length !== p.len) {
    stepsEl.innerHTML = ''; cells = [];
    let rowEl, grpEl;
    for (let i = 0; i < p.len; i++) {
      if (i % 16 === 0) { rowEl = document.createElement('div'); rowEl.className = 'srow'; stepsEl.appendChild(rowEl); }
      if (i % 4 === 0) { grpEl = document.createElement('div'); grpEl.className = 'sgrp'; rowEl.appendChild(grpEl); }
      const c = document.createElement('div'); c.className = 'cell' + (i % 4 === 0 ? ' beat' : ''); c.dataset.i = i;
      grpEl.appendChild(c); cells.push(c);
    }
  }
  cells.forEach((c, i) => c.classList.toggle('on', !!row[i]));
  phIdx = -1;
  [...$('len').children].forEach(b => b.classList.toggle('cur', +b.dataset.l === p.len));
}
function setPlayhead(i) {
  if (phIdx >= 0 && cells[phIdx]) cells[phIdx].classList.remove('ph');
  phIdx = i;
  if (i >= 0 && cells[i]) cells[i].classList.add('ph');
}
let paint = null, paintId = null;
function paintCell(c) {
  if (!c) return;
  const i = +c.dataset.i, row = pat().steps[S.sel];
  if (row[i] === paint) return;
  row[i] = paint; c.classList.toggle('on', !!paint);
  if (paint && !playing) { trigger(S.sel, ctx.currentTime); flash(S.sel); }
}
stepsEl.addEventListener('pointerdown', e => {
  const c = e.target.closest('.cell'); if (!c) return;
  e.preventDefault(); unlock();
  paint = pat().steps[S.sel][+c.dataset.i] ? 0 : 1; paintId = e.pointerId;
  stepsEl.setPointerCapture(e.pointerId);
  paintCell(c);
});
stepsEl.addEventListener('pointermove', e => {
  if (e.pointerId !== paintId) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  paintCell(el && el.closest && el.closest('.cell'));
});
const pEnd = e => { if (e.pointerId !== paintId) return; paintId = null; paint = null; save(); renderPadDots(); renderPats(); };
stepsEl.addEventListener('pointerup', pEnd); stepsEl.addEventListener('pointercancel', pEnd);

$('len').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const L = +b.dataset.l, p = pat();
  if (L === p.len) return;
  if (L === 32 && p.steps.every(r => r.slice(16).every(v => !v))) p.steps.forEach(r => { for (let i = 0; i < 16; i++) r[i + 16] = r[i]; });
  p.len = L; if (step >= L) step = 0;
  save(); renderSteps(); renderPadDots(); fit();
});

/* load file onto selected pad */
$('load').addEventListener('click', () => { unlock(); $('file').value = ''; $('file').click(); });
$('file').addEventListener('change', async () => {
  const f = $('file').files[0]; if (!f) return;
  const i = S.sel, t = $('loadt');
  t.textContent = '...';
  try {
    const ab = await f.arrayBuffer();
    samples[i] = await decode(ab.slice(0));
    const p = S.pads[i];
    p.sound = 'sample'; p.pitch = 0;
    p.sample = f.name.replace(/\.[^.]+$/, '').toUpperCase().slice(0, 14);
    idbTx('readwrite', st => st.put({ name: p.sample, data: ab }, i)).catch(() => {});
    save(); renderPads(); renderEditor(); trigger(i, ctx.currentTime); flash(i);
    t.textContent = 'LOAD';
  } catch (e) {
    t.textContent = 'ERROR'; setTimeout(() => t.textContent = 'LOAD', 1600);
  }
});

/* tape: capture master output */
const tapeBtn = $('tape');
let mr = null, chunks = [], tapeStart = 0, tapeBlob = null, tapeExt = 'm4a', tapeTimer = 0, streamDest = null;
if (!(window.MediaRecorder && ctx.createMediaStreamDestination)) tapeBtn.style.display = 'none';
function tapeLabel() {
  let t = 'TAPE';
  if (mr) { const s = Math.floor((performance.now() - tapeStart) / 1000); t = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  else if (tapeBlob) t = 'SAVE';
  $('tapet').textContent = t;
  $('tapeled').classList.toggle('on', !!mr || !!tapeBlob);
  $('tapeled').classList.toggle('blink', !!tapeBlob && !mr);
  tapeBtn.classList.toggle('arm', !!tapeBlob && !mr);
}
tapeBtn.addEventListener('click', () => {
  unlock();
  if (mr) { mr.stop(); return; }
  if (tapeBlob) { saveTape(); return; }
  streamDest = streamDest || ctx.createMediaStreamDestination();
  comp.connect(streamDest);
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  try { mr = new MediaRecorder(streamDest.stream, mime ? { mimeType: mime } : undefined); }
  catch (e) { mr = null; return; }
  tapeExt = /mp4/.test(mr.mimeType || mime) ? 'm4a' : 'webm';
  chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    try { comp.disconnect(streamDest); } catch (e) {}
    tapeBlob = new Blob(chunks, { type: mr.mimeType || mime || 'audio/mp4' });
    mr = null; clearInterval(tapeTimer); tapeLabel();
  };
  mr.start(250); tapeStart = performance.now();
  tapeTimer = setInterval(tapeLabel, 500); tapeLabel();
});
async function saveTape() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = `gbx16-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.${tapeExt}`;
  const blob = tapeBlob; tapeBlob = null; tapeLabel();
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* animation loop synced to the audio clock */
function frame() {
  const now = ctx.currentTime;
  while (uiQ.length && uiQ[0].t <= now) {
    const ev = uiQ.shift();
    setPlayhead(ev.s < cells.length ? ev.s : -1);
    lcdPos(ev.s);
    ev.hits.forEach(flash);
  }
  requestAnimationFrame(frame);
}

/* keyboard */
const KEYS = '1234qwerasdfzxcv', held = new Set();
window.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? stop() : start(); return; }
  const i = KEYS.indexOf(e.key.toLowerCase());
  if (i >= 0 && !held.has(i)) { held.add(i); padDown(i, 'k' + i); }
});
window.addEventListener('keyup', e => { const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0) { held.delete(i); padUp('k' + i); } });

/* layout */
const mainEl = $('main'), sideEl = $('side');
function fit() {
  const w = mainEl.clientWidth, h = mainEl.clientHeight, inset = 2 * parseFloat(getComputedStyle(padsEl.parentElement).paddingTop);
  let W, H;
  if (window.matchMedia('(orientation: portrait)').matches) { W = w - inset; H = h - inset - sideEl.scrollHeight - 16; }
  else { H = h - inset; W = w - inset - 20 - Math.max(360, w * 0.34); }
  // square when there is room, up to 30% wider than tall when height is the limit
  W = Math.min(W, H * 1.3); H = Math.min(H, W);
  const st = document.documentElement.style;
  st.setProperty('--padw', Math.max(220, Math.floor(W)) + 'px');
  st.setProperty('--padh', Math.max(200, Math.floor(H)) + 'px');
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 250));
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* boot */
applyGains();
$('bpm').value = S.bpm; $('bpmv').textContent = S.bpm;
swK.render(); mstK.render(); fltK.render(); renderModes();
renderPads(); renderEditor(); renderSteps(); renderPats(); renderTransport(); tapeLabel(); clrUI();
fit(); requestAnimationFrame(fit);
requestAnimationFrame(frame);
restoreSamples();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}

window.__gb = { ctx, S, get playing() { return playing; }, start, stop };
})();
</script>
</body>
