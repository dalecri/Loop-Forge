document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:6px;flex-shrink:0\">\n        <button sc-camel-on-click=\"{{ barsDown }}\" style=\"width:36px;height:36px;border-radius:10px;border:1px solid #2C2C38;background:#0E0E13;color:#F2F2F7;font-size:18px;line-height:1\">−<\u002Fbutton>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A99;min-width:52px;text-align:center\">{{ barsLabel }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ barsUp }}\" style=\"width:36px;height:36px;border-radius:10px;border:1px solid #2C2C38;background:#0E0E13;color:#F2F2F7;font-size:18px;line-height:1\">+<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;overflow-x:auto;padding-bottom:2px\">\n      <sc-for list=\"{{ layerChips }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"{{ c.wrapStyle }}\">\n          <button sc-camel-on-click=\"{{ c.onPower }}\" style=\"{{ c.dotStyle }}\"><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ c.onSelect }}\" style=\"{{ c.nameStyle }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#14141A;border:1px solid #1F1F29;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n      <div style=\"font-size:15px;font-weight:700;letter-spacing:-0.01em\">{{ selName }}<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#8A8A99\">{{ selHint }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasGrid }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <div style=\"display:flex;gap:5px;align-items:center\">\n          <div style=\"width:42px;flex-shrink:0\"><\u002Fdiv>\n          <div style=\"flex:1;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px\">\n            <sc-for list=\"{{ stepDots }}\" as=\"d\" hint-placeholder-count=\"16\"><div style=\"{{ d.style }}\"><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:5px;align-items:center\">\n            <div style=\"{{ row.labelStyle }}\">{{ row.label }}<\u002Fdiv>\n            <div style=\"flex:1;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px\">\n              <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"16\">\n                <button sc-camel-on-click=\"{{ cell.onClick }}\" style=\"{{ cell.style }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPump }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:13px;color:#8A8A99;line-height:1.5;text-wrap:pretty\">Sidechain ducks the sustained layers on every kick so the track breathes. Pick what gets pumped.<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n          <sc-for list=\"{{ pumpTargets }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin-top:2px\">\n      <sc-for list=\"{{ sliders }}\" as=\"sl\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#8A8A99\">\n            <span>{{ sl.label }}<\u002Fspan><span style=\"color:#F2F2F7\">{{ sl.display }}<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"{{ sl.min }}\" max=\"{{ sl.max }}\" step=\"{{ sl.step }}\" value=\"{{ sl.value }}\" sc-camel-on-change=\"{{ sl.onChange }}\" style=\"width:100%;height:28px\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#8A8A99\">MAKE IT MORE…<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px\">\n      <sc-for list=\"{{ nudges }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"height:46px;border-radius:12px;border:1px solid #2C2C38;background:#14141A;color:#F2F2F7;font-size:13px;font-weight:600\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#0E0E13;border:1px solid #1F1F29;border-radius:14px;overflow:hidden\">\n    <button sc-camel-on-click=\"{{ toggleCode }}\" style=\"width:100%;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:transparent;border:0;color:#F2F2F7;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em\">\n      <span>STRUDEL&nbsp;CODE<\u002Fspan><span style=\"color:#8A8A99\">{{ codeCaret }}<\u002Fspan>\n    <\u002Fbutton>\n    <sc-if value=\"{{ showCode }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:0 12px 12px;display:flex;flex-direction:column;gap:10px\">\n        <pre style=\"margin:0;padding:12px;background:#07070A;border:1px solid #1B1B24;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:#C9C9D6;overflow-x:auto;white-space:pre\">{{ code }}<\u002Fpre>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px\">\n          <button sc-camel-on-click=\"{{ copyCode }}\" style=\"height:46px;border-radius:12px;border:0;background:#38F5C8;color:#07070A;font-size:13px;font-weight:700\">Copy code<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openStrudel }}\" style=\"height:46px;border-radius:12px;border:1px solid #2C2C38;background:#14141A;color:#F2F2F7;font-size:13px;font-weight:600\">Open in Strudel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ shareLink }}\" style=\"height:46px;border-radius:12px;border:1px solid #2C2C38;background:#14141A;color:#F2F2F7;font-size:13px;font-weight:600\">Share link<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#5A5A69;letter-spacing:0.08em;padding:0 2px\">\n    <span>{{ saveState }}<\u002Fspan>\n    <button sc-camel-on-click=\"{{ resetAll }}\" style=\"background:transparent;border:0;color:#5A5A69;font-family:inherit;font-size:10px;letter-spacing:0.08em\">CLEAR ALL<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#F2F2F7;color:#07070A;padding:12px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932}}\">\nclass Component extends DCLogic {\n  state = this.makeInitial();\n\n  // ── definitions ────────────────────────────────────────────────\n  get defs() {\n    if (this._defs) return this._defs;\n    const deg = () => [7, 6, 5, 4, 3, 2, 1, 0].map(d => ({ label: String(d + 1), deg: d }));\n    const R = {\n      gain: [0, 1.4, 0.05], lpf: [200, 16000, 100], env: [0.02, 1.2, 0.01], room: [0, 0.7, 0.02]\n    };\n    const note = (id, name, color, oct, snd, envMode, envLabel, p) => ({\n      id, name, color, kind: 'note', oct, snd, envMode,\n      rows: deg(), params: p, ranges: R,\n      labels: { gain: 'Gain', lpf: 'Filter (LPF)', env: envLabel, room: 'Room' }\n    });\n    this._defs = [\n      {\n        id: 'drums', name: 'Drums', color: '#FF3D6E', kind: 'sample',\n        rows: [{ label: 'Kick', snd: 'bd' }, { label: 'Clap', snd: 'cp' }, { label: 'Hat', snd: 'hh', g: 0.5 }, { label: 'Open', snd: 'oh', g: 0.45 }],\n        params: { gain: 0.95, lpf: 16000, env: 0.12, room: 0.05 }, ranges: R,\n        labels: { gain: 'Gain', lpf: 'Tone (LPF)', env: 'Release', room: 'Room' }\n      },\n      note('bass', 'Bass', '#7C5CFF', 2, 'sawtooth', 'pluck', 'Decay', { gain: 0.85, lpf: 900, env: 0.18, room: 0 }),\n      note('lead', 'Lead', '#38F5C8', 4, 'sawtooth', 'pluck', 'Decay', { gain: 0.6, lpf: 4000, env: 0.16, room: 0.2 }),\n      note('chords', 'Chords', '#4CA8FF', 3, 'sawtooth', 'pad', 'Attack', { gain: 0.45, lpf: 2600, env: 0.35, room: 0.4 }),\n      note('vox', 'Vocal chops', '#FFB43D', 5, 'sawtooth', 'vowel', 'Decay', { gain: 0.5, lpf: 3500, env: 0.14, room: 0.25 }),\n      note('arp', 'Arp', '#C6FF3D', 4, 'triangle', 'pluck', 'Decay', { gain: 0.4, lpf: 5000, env: 0.1, room: 0.3 }),\n      {\n        id: 'fx', name: 'FX & risers', color: '#FF6BFF', kind: 'sample',\n        rows: [\n          { label: 'Riser', snd: 'white', suffix: '.attack(0.5).release(0.15).hpf(900)' },\n          { label: 'Fall', snd: 'white', suffix: '.attack(0.01).decay(0.45).sustain(0).lpf(2500)' },\n          { label: 'Sub', snd: 'sine', suffix: '.note(\"c1\").attack(0.01).decay(0.7).sustain(0)' },\n          { label: 'Air', snd: 'pink', suffix: '.attack(0.01).decay(0.25).sustain(0).hpf(4500)' }\n        ],\n        params: { gain: 0.45, lpf: 16000, env: 0.2, room: 0.35 }, ranges: R,\n        labels: { gain: 'Gain', lpf: 'Tone (LPF)', env: 'Release', room: 'Room' }\n      },\n      {\n        id: 'pump', name: 'Sidechain pump', color: '#FF3D6E', kind: 'pump',\n        params: { amount: 0.7, rate: 1, gain: 1, room: 0 },\n        ranges: { amount: [0, 1, 0.05], rate: [0.5, 4, 0.5] },\n        labels: { amount: 'Depth', rate: 'Pumps / bar' }\n      }\n    ];\n    return this._defs;\n  }\n  get sectionDefs() {\n    return [\n      { id: 'intro', name: 'Intro', bars: 8 }, { id: 'build', name: 'Build', bars: 8 },\n      { id: 'drop', name: 'Drop', bars: 16 }, { id: 'breakdown', name: 'Break', bars: 8 }\n    ];\n  }\n  def(id) { return this.defs.find(d => d.id === id); }\n  rowCount(d) { return d.kind === 'pump' ? 0 : d.rows.length; }\n\n  // ── state ──────────────────────────────────────────────────────\n  makeInitial() {\n    const layers = {};\n    for (const d of this.defs) {\n      layers[d.id] = { params: Object.assign({}, d.params), steps: this.blank(this.rowCount(d)) };\n    }\n    const sections = {};\n    for (const s of this.sectionDefs) {\n      sections[s.id] = { bars: s.bars, on: { drums: true, bass: true, lead: true, chords: true, vox: true, arp: true, fx: true, pump: true } };\n    }\n    sections.intro.on = { drums: true, chords: true, pump: true };\n    sections.build.on = { drums: true, bass: true, arp: true, fx: true, pump: true };\n    sections.breakdown.on = { chords: true, vox: true, arp: true, pump: true };\n    const st = {\n      bpm: 148, keyRoot: 'C', scaleName: 'minor', mode: 'loop', section: 'drop', sel: 'drums',\n      playing: false, step: -1, showCode: false, toast: '', saved: '', layers, sections,\n      pumpOn: true, pumpTargets: { bass: true, chords: true, vox: false, arp: true, lead: false }\n    };\n    return st;\n  }\n  blank(rows) { return Array.from({ length: rows }, () => Array(16).fill(false)); }\n\n  componentDidMount() {\n    let loaded = null;\n    try {\n      const h = location.hash.match(/[#&]s=([^&]+)/);\n      if (h) loaded = JSON.parse(decodeURIComponent(escape(atob(h[1].replace(/-/g, '+').replace(/_/g, '/')))));\n      else { const raw = localStorage.getItem('loopforge.v1'); if (raw) loaded = JSON.parse(raw); }\n    } catch (e) { loaded = null; }\n    if (loaded && loaded.layers) {\n      const base = this.makeInitial();\n      loaded.sections = Object.assign({}, base.sections, loaded.sections || {});\n      if (loaded.sections.break) { loaded.sections.breakdown = loaded.sections.break; delete loaded.sections.break; }\n      for (const s of this.sectionDefs) if (!loaded.sections[s.id]) loaded.sections[s.id] = base.sections[s.id];\n      if (!loaded.sections[loaded.section]) loaded.section = 'drop';\n      loaded.layers = Object.assign({}, base.layers, loaded.layers);\n      if (!loaded.layers[loaded.sel]) loaded.sel = 'drums';\n    }\n    if (loaded && loaded.layers) this.setState(Object.assign({}, loaded, { playing: false, step: -1, toast: '' }));\n    else this.apply('hyperpop', true);\n    this._raf = requestAnimationFrame(this.tick);\n  }\n  componentWillUnmount() { cancelAnimationFrame(this._raf); if (window.hush) window.hush(); }\n\n  tick = () => {\n    this._raf = requestAnimationFrame(this.tick);\n    if (!this.state.playing || !this._t0) { if (this.state.step !== -1) this.setState({ step: -1 }); return; }\n    const barSec = 240 / this.state.bpm;\n    const s = Math.floor((((performance.now() - this._t0) / 1000) % barSec) / (barSec / 16));\n    if (s !== this.state.step) this.setState({ step: s });\n  };\n\n  persist(st) {\n    try { localStorage.setItem('loopforge.v1', JSON.stringify(this.strip(st))); } catch (e) {}\n  }\n  strip(st) {\n    const { bpm, keyRoot, scaleName, mode, section, sel, layers, sections, pumpOn, pumpTargets } = st;\n    return { bpm, keyRoot, scaleName, mode, section, sel, layers, sections, pumpOn, pumpTargets };\n  }\n  mut(fn, replay = true) {\n    this.setState(prev => {\n      const next = JSON.parse(JSON.stringify(this.strip(prev)));\n      fn(next);\n      this.persist(next);\n      return next;\n    }, () => { if (replay && this.state.playing) this.evaluate(); });\n  }\n  flash(msg) { this.setState({ toast: msg }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 1800); }\n\n  // ── code generation ────────────────────────────────────────────\n  tokens(arr) { return arr.join(' '); }\n  sampleCode(d, L) {\n    const out = [];\n    d.rows.forEach((row, ri) => {\n      const on = L.steps[ri];\n      if (!on || !on.some(Boolean)) return;\n      const toks = on.map(v => (v ? row.snd : '~'));\n      const g = (L.params.gain * (row.g || 1)).toFixed(2);\n      let line = '  s(\"' + this.tokens(toks) + '\")';\n      if (row.suffix) line += row.suffix;\n      else line += '.release(' + L.params.env.toFixed(2) + ')';\n      if (L.params.lpf < 15500) line += '.lpf(' + Math.round(L.params.lpf) + ')';\n      if (L.params.room > 0.01) line += '.room(' + L.params.room.toFixed(2) + ')';\n      line += '.gain(' + g + ')';\n      out.push(line);\n    });\n    if (!out.length) return null;\n    return out.length === 1 ? out[0].trim() : 'stack(\\n' + out.join(',\\n') + '\\n)';\n  }\n  noteCode(d, L, pumped) {\n    const toks = [];\n    let any = false;\n    for (let s = 0; s < 16; s++) {\n      const degs = [];\n      d.rows.forEach((row, ri) => { if (L.steps[ri] && L.steps[ri][s]) degs.push(row.deg); });\n      if (!degs.length) { toks.push('~'); continue; }\n      any = true;\n      degs.sort((a, b) => a - b);\n      toks.push(degs.length === 1 ? String(degs[0]) : '[' + degs.join(',') + ']');\n    }\n    if (!any) return null;\n    let line = 'n(\"' + this.tokens(toks) + '\")';\n    line += '.scale(\"' + this.state.keyRoot + d.oct + ':' + this.state.scaleName + '\")';\n    line += '.s(\"' + d.snd + '\")';\n    const e = L.params.env;\n    if (d.envMode === 'pad') line += '.attack(' + e.toFixed(2) + ').release(' + (e * 2).toFixed(2) + ').sustain(0.75)';\n    else line += '.attack(0.005).decay(' + e.toFixed(2) + ').sustain(0)';\n    if (d.envMode === 'vowel') line += '.vowel(\"<a e i o>\")';\n    line += '.lpf(' + Math.round(L.params.lpf) + ')';\n    if (L.params.room > 0.01) line += '.room(' + L.params.room.toFixed(2) + ')';\n    const g = L.params.gain;\n    if (pumped) {\n      const p = this.state.layers.pump.params;\n      const lo = (g * (1 - p.amount)).toFixed(2);\n      line += '.gain(sine.range(' + lo + ', ' + g.toFixed(2) + ').fast(' + p.rate + '))';\n    } else line += '.gain(' + g.toFixed(2) + ')';\n    return line;\n  }\n  layerCode(id) {\n    const d = this.def(id), L = this.state.layers[id];\n    if (!d || d.kind === 'pump') return null;\n    const pumped = this.state.pumpOn && !!this.state.pumpTargets[id];\n    return d.kind === 'sample' ? this.sampleCode(d, L) : this.noteCode(d, L, pumped);\n  }\n  buildCode(forPlayback) {\n    const st = this.state;\n    const live = [];\n    const lines = [];\n    lines.push('// ' + st.keyRoot + ' ' + st.scaleName + ' · ' + st.bpm + ' BPM · made in Loop Forge');\n    lines.push('setcpm(' + st.bpm + '/4)   // ' + st.bpm + ' BPM, one cycle = one bar');\n    lines.push('');\n    for (const d of this.defs) {\n      const c = this.layerCode(d.id);\n      if (!c) continue;\n      live.push(d.id);\n      lines.push('// ' + d.name.toUpperCase());\n      lines.push('const ' + d.id + ' = ' + c);\n      lines.push('');\n    }\n    if (!live.length) return '// tap the grid to make a sound\\nsilence';\n    const secIds = this.sectionDefs.map(s => s.id);\n    const stackOf = secId => {\n      const on = live.filter(id => st.sections[secId].on[id]);\n      return on.length ? 'stack(' + on.join(', ') + ')' : 'silence';\n    };\n    if (forPlayback && st.mode === 'loop') {\n      lines.push('// playing the ' + st.section.toUpperCase() + ' section on loop');\n      lines.push(stackOf(st.section));\n      return lines.join('\\n');\n    }\n    lines.push('// ── SECTIONS ──');\n    for (const id of secIds) lines.push('const ' + id + ' = ' + stackOf(id));\n    lines.push('');\n    lines.push('// ── ARRANGEMENT ──');\n    if (st.mode === 'loop') {\n      lines.push('// (looping ' + st.section + ' — switch to SONG for the full arrangement)');\n      lines.push(st.section);\n    } else {\n      lines.push('arrange(' + secIds.map(id => '[' + st.sections[id].bars + ', ' + id + ']').join(', ') + ')');\n    }\n    return lines.join('\\n');\n  }\n\n  // ── audio ──────────────────────────────────────────────────────\n  async ensure() {\n    if (this._inited) return true;\n    if (!window.initStrudel) { this.flash('Audio engine still loading…'); return false; }\n    window.initStrudel({ prebake: () => window.samples('github:tidalcycles/dirt-samples') });\n    this._inited = true;\n    await new Promise(r => setTimeout(r, 400));\n    return true;\n  }\n  async evaluate() {\n    if (!this._inited) return;\n    try { await window.evaluate(this.buildCode(true)); } catch (e) { this.flash('Pattern error — check the code'); }\n  }\n  togglePlay = async () => {\n    if (this.state.playing) { if (window.hush) window.hush(); this.setState({ playing: false, step: -1 }); return; }\n    const ok = await this.ensure();\n    if (!ok) return;\n    this._t0 = performance.now();\n    this.setState({ playing: true }, () => this.evaluate());\n  };\n\n  // ── generators ─────────────────────────────────────────────────\n  parse(str) { return str.split('').map(c => c === 'x'); }\n  setRows(next, id, map) {\n    const d = this.def(id);\n    next.layers[id].steps = this.blank(this.rowCount(d));\n    for (const k of Object.keys(map)) next.layers[id].steps[Number(k)] = this.parse(map[k]);\n  }\n  presets() {\n    return {\n      hyperpop: {\n        name: 'Hyperpop bounce', bpm: 158, keyRoot: 'C', scaleName: 'minor',\n        pat: {\n          drums: { 0: 'x..x..x...x.x...', 1: '....x.......x..x', 2: '..x.x.x.x.x.x.xx', 3: '......x.........' },\n          bass: { 7: 'x..x..x...x.x...', 5: '......x.....x...' },\n          lead: { 3: '....x.......x...', 1: '..........x.....', 5: 'x...............' },\n          chords: { 7: 'x.......x.......', 5: 'x.......x.......', 3: 'x.......x.......' },\n          vox: { 2: '......x.......x.', 4: '............x...' },\n          arp: { 7: 'x...x...x...x...', 5: '..x...x...x...x.', 3: '.x...x...x...x..' },\n          fx: { 0: '..............x.' }\n        }\n      },\n      prog: {\n        name: 'Prog house roller', bpm: 126, keyRoot: 'A', scaleName: 'minor',\n        pat: {\n          drums: { 0: 'x...x...x...x...', 1: '....x.......x...', 2: '..x...x...x...x.', 3: '......x.......x.' },\n          bass: { 7: '..x...x...x...x.', 6: '..............x.' },\n          lead: { 4: '....x.......x...', 2: '..........x.....' },\n          chords: { 7: 'x.......x.......', 4: 'x.......x.......', 2: 'x.......x.......' },\n          vox: { 3: '..........x.....' },\n          arp: { 7: 'x.x.x.x.x.x.x.x.', 4: '.x.x.x.x.x.x.x.x' },\n          fx: { 3: 'x...............' }\n        }\n      },\n      pluck: {\n        name: 'Deadmau5 pluck', bpm: 128, keyRoot: 'F', scaleName: 'minor',\n        pat: {\n          drums: { 0: 'x...x...x...x...', 1: '............x...', 2: '..x...x...x...x.' },\n          bass: { 7: 'x...x...x...x...' },\n          lead: { 7: 'x.......x.......', 5: '..x.......x.....', 3: '....x.......x...', 2: '......x.......x.' },\n          chords: { 6: 'x...............', 4: '........x.......', 1: 'x.......x.......' },\n          arp: { 7: 'x..x..x.x..x..x.' },\n          fx: { 2: '..............x.' }\n        }\n      }\n    };\n  }\n  apply(key, silentLoad) {\n    const p = this.presets()[key];\n    this.mut(next => {\n      next.bpm = p.bpm; next.keyRoot = p.keyRoot; next.scaleName = p.scaleName;\n      for (const d of this.defs) if (d.kind !== 'pump') next.layers[d.id].steps = this.blank(this.rowCount(d));\n      for (const id of Object.keys(p.pat)) this.setRows(next, id, p.pat[id]);\n      for (const s of this.sectionDefs) next.sections[s.id].on = Object.assign({}, this.state.sections[s.id].on);\n    });\n    if (!silentLoad) this.flash(p.name);\n  }\n  dice = () => {\n    const rnd = (n) => Math.random() < n;\n    const pick = a => a[Math.floor(Math.random() * a.length)];\n    this.mut(next => {\n      const set = (id, map) => this.setRows(next, id, map);\n      const s16 = fn => Array.from({ length: 16 }, (_, i) => (fn(i) ? 'x' : '.')).join('');\n      const four = rnd(0.5);\n      set('drums', {\n        0: s16(i => (four ? i % 4 === 0 : [0, 3, 6, 10, 12].includes(i) || (i === 14 && rnd(0.4)))),\n        1: s16(i => i % 8 === 4 || (i === 15 && rnd(0.4))),\n        2: s16(i => (rnd(0.7) ? i % 2 === 0 : rnd(0.35))),\n        3: s16(i => i % 8 === 6 && rnd(0.6))\n      });\n      set('bass', { 7: s16(i => (four ? i % 4 === 2 : [0, 3, 6, 10, 12].includes(i))), 5: s16(i => i === 14 && rnd(0.5)) });\n      const mel = pick([[0, 4, 7, 12], [0, 2, 6, 10], [2, 6, 8, 14]]);\n      set('lead', { 3: s16(i => mel.includes(i) && rnd(0.8)), 5: s16(i => i === mel[0] + 1) });\n      set('chords', { 7: 'x.......x.......', 5: 'x.......x.......', 3: 'x.......x.......' });\n      set('vox', { 2: s16(i => i % 8 === 6 && rnd(0.7)) });\n      set('arp', { 7: s16(i => i % 4 === 0), 5: s16(i => i % 4 === 2), 3: s16(i => i % 8 === 1) });\n      set('fx', { 0: s16(i => i === 14 && rnd(0.5)) });\n      next.bpm = 120 + Math.floor(Math.random() * 8) * 5;\n      next.keyRoot = pick(['C', 'D', 'F', 'G', 'A']);\n    });\n    this.flash('Rolled a fresh loop');\n  };\n  nudge(kind) {\n    const or = (a, b) => a.map((v, i) => v || b[i]);\n    this.mut(next => {\n      const L = next.layers;\n      if (kind === 'harder') {\n        L.drums.steps[2] = Array.from({ length: 16 }, () => true);\n        L.drums.steps[0] = or(L.drums.steps[0], this.parse('..........x....x'));\n        L.drums.params.gain = Math.min(1.4, L.drums.params.gain + 0.15);\n        L.bass.params.lpf = Math.min(16000, L.bass.params.lpf + 500);\n        L.bass.params.env = Math.max(0.05, L.bass.params.env - 0.04);\n        next.pumpOn = true;\n      } else if (kind === 'dreamier') {\n        L.chords.params.env = Math.min(1.2, L.chords.params.env + 0.2);\n        L.chords.params.room = Math.min(0.7, L.chords.params.room + 0.15);\n        L.chords.params.gain = Math.min(1.4, L.chords.params.gain + 0.08);\n        L.lead.params.room = Math.min(0.7, L.lead.params.room + 0.15);\n        L.lead.params.lpf = Math.max(400, L.lead.params.lpf - 900);\n        L.drums.steps[2] = L.drums.steps[2].map((v, i) => v && i % 4 === 2);\n        next.bpm = Math.max(90, next.bpm - 6);\n      } else if (kind === 'faster') {\n        next.bpm = Math.min(180, next.bpm + 8);\n        L.arp.steps[7] = this.parse('x.x.x.x.x.x.x.x.');\n      } else if (kind === 'weirder') {\n        for (const id of ['lead', 'vox', 'arp']) {\n          const sh = 1 + Math.floor(Math.random() * 5);\n          L[id].steps = L[id].steps.map(r => r.slice(sh).concat(r.slice(0, sh)));\n        }\n        L.vox.params.lpf = 1200 + Math.floor(Math.random() * 5000);\n        L.fx.steps[3] = this.parse('..x.....x......x');\n      }\n    });\n    this.flash(kind === 'harder' ? 'Harder' : kind === 'dreamier' ? 'Dreamier' : kind === 'faster' ? 'Faster' : 'Weirder');\n  }\n\n  // ── export ─────────────────────────────────────────────────────\n  b64(s) { return btoa(unescape(encodeURIComponent(s))); }\n  copyCode = () => {\n    const code = this.buildCode(false);\n    const done = () => this.flash('Code copied — paste into strudel.cc');\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => this.flash('Select the code to copy'));\n    else this.flash('Select the code to copy');\n  };\n  openStrudel = () => { window.open('https://strudel.cc/#' + encodeURIComponent(this.b64(this.buildCode(false))), '_blank'); };\n  shareLink = () => {\n    const enc = this.b64(JSON.stringify(this.strip(this.state))).replace(/\\+/g, '-').replace(/\\//g, '_');\n    const url = location.origin + location.pathname + '#s=' + enc;\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => this.flash('Share link copied'));\n    else this.flash('Link: ' + url);\n  };\n  resetAll = () => {\n    if (window.hush) window.hush();\n    const fresh = this.makeInitial();\n    this.persist(fresh);\n    this.setState(fresh);\n    this.flash('Cleared');\n  };\n\n  // ── render inputs ──────────────────────────────────────────────\n  renderVals() {\n    const st = this.state, d = this.def(st.sel), L = st.layers[st.sel];\n    const acc = d.color;\n    const btn = (active, color) => 'height:44px;padding:0 14px;border-radius:12px;flex-shrink:0;font-size:13px;font-weight:600;border:1px solid ' +\n      (active ? color : '#2C2C38') + ';background:' + (active ? color : '#14141A') + ';color:' + (active ? '#07070A' : '#F2F2F7') + ';white-space:nowrap';\n\n    const rows = (d.kind === 'pump' ? [] : d.rows).map((row, ri) => ({\n      label: row.label,\n      labelStyle: 'width:42px;flex-shrink:0;font-family:\\'JetBrains Mono\\',monospace;font-size:9px;letter-spacing:0.06em;color:#8A8A99;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',\n      cells: Array.from({ length: 16 }, (_, si) => {\n        const on = !!(L.steps[ri] && L.steps[ri][si]);\n        const beat = si % 4 === 0;\n        const head = st.playing && st.step === si;\n        return {\n          style: 'aspect-ratio:1;min-height:26px;border-radius:6px;padding:0;border:1px solid ' +\n            (on ? acc : head ? '#4A4A5A' : beat ? '#31313E' : '#212129') +\n            ';background:' + (on ? acc : head ? '#1E1E28' : beat ? '#16161D' : '#101015') +\n            ';box-shadow:' + (on ? '0 0 10px ' + acc + '55' : 'none'),\n          onClick: () => this.mut(next => { next.layers[st.sel].steps[ri][si] = !next.layers[st.sel].steps[ri][si]; })\n        };\n      })\n    }));\n\n    const paramKeys = d.kind === 'pump' ? ['amount', 'rate'] : ['gain', 'lpf', 'env', 'room'];\n    const sliders = paramKeys.map(k => {\n      const rg = d.ranges[k];\n      const v = L.params[k];\n      return {\n        label: d.labels[k], min: rg[0], max: rg[1], step: rg[2], value: v,\n        display: k === 'lpf' ? Math.round(v) + ' Hz' : k === 'rate' ? v + '×' : Number(v).toFixed(2),\n        onChange: e => { const val = parseFloat(e.target.value); this.mut(next => { next.layers[st.sel].params[k] = val; }); }\n      };\n    });\n\n    return {\n      bpm: st.bpm, bpmLabel: st.bpm + ' BPM', keyRoot: st.keyRoot, scaleName: st.scaleName,\n      keyOpts: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'],\n      scaleOpts: ['minor', 'major', 'dorian', 'phrygian', 'lydian', 'minor pentatonic', 'harmonic minor'],\n      setBpm: e => { const v = parseInt(e.target.value, 10); this.mut(next => { next.bpm = v; }); },\n      setKey: e => { const v = e.target.value; this.mut(next => { next.keyRoot = v; }); },\n      setScale: e => { const v = e.target.value; this.mut(next => { next.scaleName = v; }); },\n\n      playing: st.playing, playLabel: st.playing ? 'STOP' : 'PLAY', togglePlay: this.togglePlay,\n      playBtnStyle: 'height:44px;min-width:96px;padding:0 18px;border-radius:12px;border:0;font-family:\\'JetBrains Mono\\',monospace;font-size:13px;font-weight:600;letter-spacing:0.12em;background:' +\n        (st.playing ? '#FF3D6E' : '#38F5C8') + ';color:#07070A' + (st.playing ? ';animation:ssPulse 1.6s ease-in-out infinite' : ''),\n      modeLabel: st.mode === 'loop' ? 'LOOP' : 'SONG',\n      toggleMode: () => this.mut(next => { next.mode = next.mode === 'loop' ? 'song' : 'loop'; }),\n\n      presetBtns: [\n        { label: 'Hyperpop', onClick: () => this.apply('hyperpop'), style: btn(false) },\n        { label: 'Prog house', onClick: () => this.apply('prog'), style: btn(false) },\n        { label: 'Pluck', onClick: () => this.apply('pluck'), style: btn(false) },\n        { label: '🎲 Roll', onClick: this.dice, style: btn(true, '#C6FF3D') }\n      ],\n\n      sectionTabs: this.sectionDefs.map(s => ({\n        label: s.name, onClick: () => this.mut(next => { next.section = s.id; }),\n        style: btn(st.section === s.id, '#F2F2F7') + ';height:38px;padding:0 12px;font-size:12px'\n      })),\n      barsLabel: st.sections[st.section].bars + ' bars',\n      barsDown: () => this.mut(next => { next.sections[next.section].bars = Math.max(2, next.sections[next.section].bars - 2); }),\n      barsUp: () => this.mut(next => { next.sections[next.section].bars = Math.min(32, next.sections[next.section].bars + 2); }),\n\n      layerChips: this.defs.map(x => {\n        const on = !!st.sections[st.section].on[x.id];\n        const isSel = st.sel === x.id;\n        return {\n          label: x.name,\n          wrapStyle: 'display:flex;align-items:center;gap:6px;flex-shrink:0;padding:4px 10px 4px 6px;border-radius:12px;border:1px solid ' +\n            (isSel ? x.color : '#2C2C38') + ';background:' + (isSel ? x.color + '1F' : '#0E0E13'),\n          dotStyle: 'width:32px;height:32px;border-radius:9px;flex-shrink:0;border:1px solid ' + (on ? x.color : '#2C2C38') +\n            ';background:' + (on ? x.color : 'transparent') + ';box-shadow:' + (on ? '0 0 10px ' + x.color + '66' : 'none'),\n          nameStyle: 'background:transparent;border:0;padding:4px 0;font-family:inherit;font-size:13px;font-weight:600;color:' + (isSel ? '#F2F2F7' : '#8A8A99'),\n          onSelect: () => this.mut(next => { next.sel = x.id; }, false),\n          onPower: () => this.mut(next => { next.sections[next.section].on[x.id] = !next.sections[next.section].on[x.id]; })\n        };\n      }),\n\n      selName: d.name,\n      selHint: d.kind === 'pump' ? (st.pumpOn ? 'ON' : 'OFF') : d.kind === 'note' ? 'SCALE DEGREES · 16 STEPS' : 'SOUNDS · 16 STEPS',\n      hasGrid: d.kind !== 'pump', isPump: d.kind === 'pump', rows, sliders,\n      stepDots: Array.from({ length: 16 }, (_, i) => ({\n        style: 'height:5px;border-radius:99px;background:' + (st.playing && st.step === i ? '#F2F2F7' : i % 4 === 0 ? '#3A3A47' : '#1C1C24')\n      })),\n      pumpTargets: [{ id: 'on', name: 'Pump ON' }].concat(['bass', 'chords', 'lead', 'arp', 'vox'].map(id => ({ id, name: this.def(id).name })))\n        .map(t => {\n          const active = t.id === 'on' ? st.pumpOn : !!st.pumpTargets[t.id];\n          return {\n            label: t.name, style: btn(active, t.id === 'on' ? '#FF3D6E' : '#F2F2F7') + ';height:40px;font-size:12px',\n            onClick: () => this.mut(next => {\n              if (t.id === 'on') next.pumpOn = !next.pumpOn; else next.pumpTargets[t.id] = !next.pumpTargets[t.id];\n            })\n          };\n        }),\n\n      nudges: [\n        { label: 'Harder', onClick: () => this.nudge('harder') },\n        { label: 'Dreamier', onClick: () => this.nudge('dreamier') },\n        { label: 'Faster', onClick: () => this.nudge('faster') },\n        { label: 'Weirder', onClick: () => this.nudge('weirder') }\n      ],\n\n      showCode: st.showCode, codeCaret: st.showCode ? '▾' : '▸',\n      toggleCode: () => this.setState(p => ({ showCode: !p.showCode })),\n      code: this.buildCode(false),\n      copyCode: this.copyCode, openStrudel: this.openStrudel, shareLink: this.shareLink,\n      resetAll: this.resetAll, toast: st.toast,\n      saveState: 'SAVED ON THIS DEVICE'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
