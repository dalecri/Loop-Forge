document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

on { font-family: inherit; cursor: pointer; }\n  @keyframes lfBlink { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }\n  @keyframes lfDrift { 0% { background-position: 0 0 } 100% { background-position: 64px 64px } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position:relative;min-height:100vh;background:linear-gradient(178deg,#1B0F42 0%,#2A1257 42%,#45166B 78%,#5B1A5E 100%);font-family:'Pixelify Sans',ui-monospace,monospace;color:#EDE9FF;padding:12px 12px 44px;touch-action:manipulation;overflow-x:hidden\">\n\n  <div style=\"position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.028) 0deg 90deg, transparent 90deg 180deg);background-size:16px 16px;animation:lfDrift 24s linear infinite\"><\u002Fdiv>\n  <div style=\"{{ scanStyle }}\"><\u002Fdiv>\n\n  <div style=\"position:relative;max-width:1480px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:start\">\n\n    <div style=\"grid-column:1/-1;border:3px solid #0C0620;background:linear-gradient(180deg,#33196E 0%,#26124F 100%);box-shadow:0 5px 0 #0C0620,inset 0 3px 0 rgba(255,255,255,.18)\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;background:linear-gradient(90deg,#FF6EC7 0%,#A16BFF 55%,#5CE1E6 100%);border-bottom:3px solid #0C0620\">\n        <span style=\"font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:0.16em;color:#180A33\">◈ LOOP.FORGE — STRUDEL MACHINE<\u002Fspan>\n        <span style=\"display:flex;gap:4px\">\n          <span style=\"width:12px;height:12px;background:#EDE9FF;border:2px solid #0C0620\"><\u002Fspan>\n          <span style=\"width:12px;height:12px;background:#EDE9FF;border:2px solid #0C0620\"><\u002Fspan>\n          <span style=\"width:12px;height:12px;background:#FFE066;border:2px solid #0C0620\"><\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between\">\n        <div style=\"display:flex;flex-direction:column;gap:4px;min-width:200px\">\n          <div style=\"font-family:'Silkscreen',monospace;font-size:clamp(20px,4.4vw,34px);line-height:1.1;letter-spacing:0.04em;background:linear-gradient(180deg,#FFFFFF 0%,#D9D4FF 42%,#7A6BD1 52%,#FFFFFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 2px 0 #0C0620)\">LOOP FORGE<\u002Fdiv>\n          <div style=\"font-family:'VT323',monospace;font-size:15px;letter-spacing:0.12em;color:#9C8DE8\">tap blocks &gt; get music &gt; steal the code<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <button sc-camel-on-click=\"{{ toggleMode }}\" style=\"{{ modeBtnStyle }}\">{{ modeLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ togglePlay }}\" style=\"{{ playBtnStyle }}\">{{ playLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"grid-column:1/-1;border:3px solid #0C0620;background:#1D1044;box-shadow:0 5px 0 #0C0620,inset 0 3px 0 rgba(255,255,255,.14)\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;background:linear-gradient(90deg,#5CE1E6,#6E9BFF);border-bottom:3px solid #0C0620\">\n        <span style=\"font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:0.16em;color:#180A33\">▤ STEP GRID<\u002Fspan>\n        <span style=\"font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:0.14em;color:#180A33\">{{ selHint }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"padding:10px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;gap:6px;overflow-x:auto;padding-bottom:4px\">\n          <sc-for list=\"{{ layerChips }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <div style=\"{{ c.wrapStyle }}\">\n              <button sc-camel-on-click=\"{{ c.onPower }}\" style=\"{{ c.dotStyle }}\">{{ c.dotMark }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ c.onSelect }}\" style=\"{{ c.nameStyle }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasGrid }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:3px;background:#120A2E;border:3px solid #0C0620;padding:6px;box-shadow:inset 0 0 0 1px #34206B\">\n            <div style=\"display:flex;gap:4px;align-items:center\">\n              <div style=\"width:clamp(34px,7vw,60px);flex-shrink:0\"><\u002Fdiv>\n              <div style=\"flex:1;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px\">\n                <sc-for list=\"{{ stepDots }}\" as=\"d\" hint-placeholder-count=\"16\"><div style=\"{{ d.style }}\"><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:4px;align-items:center\">\n                <div style=\"{{ row.labelStyle }}\">{{ row.label }}<\u002Fdiv>\n                <div style=\"flex:1;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px\">\n                  <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"16\">\n                    <button sc-camel-on-click=\"{{ cell.onClick }}\" style=\"{{ cell.style }}\"><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPump }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;background:#120A2E;border:3px solid #0C0620;padding:12px\">\n            <div style=\"font-size:15px;line-height:1.55;color:#C7BCFF;text-wrap:pretty\">Sidechain ducks the sustaine Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px\">\n            <sc-for list=\"{{ keyBtns }}\" as=\"k\" hint-placeholder-count=\"12\">\n              <button sc-camel-on-click=\"{{ k.onClick }}\" style=\"{{ k.style }}\">{{ k.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:0.16em;color:#9C8DE8\">SCALE<\u002Fdiv>\n          <div style=\"display:flex;align-items:stretch;gap:4px\">\n            <button sc-camel-on-click=\"{{ scalePrev }}\" style=\"width:44px;height:44px;border:3px solid #0C0620;background:#3A1F7A;color:#EDE9FF;font-size:16px;box-shadow:0 3px 0 #0C0620\">◀<\u002Fbutton>\n            <div style=\"flex:1;display:flex;align-items:center;justify-content:center;border:3px solid #0C0620;background:#0C0620;color:#B8FF5C;font-family:'VT323',monospace;font-size:20px;letter-spacing:0.06em\">{{ scaleName }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ scaleNext }}\" style=\"width:44px;height:44px;border:3px solid #0C0620;background:#3A1F7A;color:#EDE9FF;font-size:16px;box-shadow:0 3px 0 #0C0620\">▶<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:3px solid #0C0620;background:#1D1044;box-shadow:0 5px 0 #0C0620,inset 0 3px 0 rgba(255,255,255,.14)\">\n      <div style=\"padding:5px 8px;background:linear-gradient(90deg,#B8FF5C,#5CE1E6);border-bottom:3px solid #0C0620;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:0.16em;color:#180A33\">★ STARTERS<\u002Fdiv>\n      <div style=\"padding:12px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px\">\n          <sc-for list=\"{{ presetBtns }}\" as=\"p\" hint-placeholder-count=\"4\">\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:0.14em;color:#7A6BB8;padding:2px 4px\">\n      <span>{{ saveState }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ resetAll }}\" style=\"background:transparent;border:0;color:#7A6BB8;font-family:inherit;font-size:9px;letter-spacing:0.14em\">[ CLEAR ALL ]<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#FFE066;color:#0C0620;border:3px solid #0C0620;box-shadow:0 5px 0 #0C0620;padding:12px 18px;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:0.12em;z-index:60;max-width:92vw;text-align:center\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;cellSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Cozy&quot;,&quot;Chunky&quot;],&quot;default&quot;:&quot;Cozy&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feel&quot;},&quot;scanlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Feel&quot;},&quot;startPreset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Hyperpop bounce&quot;,&quot;Prog house roller&quot;,&quot;Deadmau5 pluck&quot;],&quot;default&quot;:&quot;Hyperpop bounce&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feel&quot;}}\">\nclass Component extends DCLogic {\n  state = this.makeInitial();\n\n  // ── definitions ────────────────────────────────────────────────\n  get defs() {\n    if (this._defs) return this._defs;\n    const deg = () => [7, 6, 5, 4, 3, 2, 1, 0].map(d => ({ label: 'deg ' + (d + 1), deg: d }));\n    const R = { gain: [0, 1.4, 0.05], lpf: [200, 16000, 100], env: [0.02, 1.2, 0.01], room: [0, 0.7, 0.02] };\n    const note = (id, name, color, oct, snd, envMode, envLabel, p) => ({\n      id, name, color, kind: 'note', oct, snd, envMode,\n      rows: deg(), params: p, ranges: R,\n      labels: { gain: 'GAIN', lpf: 'FILTER', env: envLabel, room: 'ROOM' }\n    });\n    this._defs = [\n      {\n        id: 'drums', name: 'DRUMS', color: '#FF6EC7', kind: 'sample',\n        rows: [{ label: 'kick', snd: 'bd' }, { label: 'clap', snd: 'cp' }, { label: 'hat', snd: 'hh', g: 0.5 }, { label: 'open', snd: 'oh', g: 0.45 }],\n        params: { gain: 0.95, lpf: 16000, env: 0.12, room: 0.05 }, ranges: R,\n        labels: { gain: 'GAIN', lpf: 'TONE', env: 'RELEASE', room: 'ROOM' }\n      },\n      note('bass', 'BASS', '#A16BFF', 2, 'sawtooth', 'pluck', 'DECAY', { gain: 0.85, lpf: 900, env: 0.18, room: 0 }),\n      note('lead', 'LEAD', '#5CE1E6', 4, 'sawtooth', 'pluck', 'DECAY', { gain: 0.6, lpf: 4000, env: 0.16, room: 0.2 }),\n      note('chords', 'CHORDS', '#6E9BFF', 3, 'sawtooth', 'pad', 'ATTACK', { gain: 0.45, lpf: 2600, env: 0.35, room: 0.4 }),\n      note('vox', 'VOX CHOPS', '#FFE066', 5, 'sawtooth', 'vowel', 'DECAY', { gain: 0.5, lpf: 3500, env: 0.14, room: 0.25 }),\n      note('arp', 'ARP', '#B8FF5C', 4, 'triangle', 'pluck', 'DECAY', { gain: 0.4, lpf: 5000, env: 0.1, room: 0.3 }),\n      {\n        id: 'fx', name: 'FX', color: '#FF9F5C', kind: 'sample',\n        rows: [\n          { label: 'riser', snd: 'white', suffix: '.attack(0.5).release(0.15).hpf(900)' },\n          { label: 'fall', snd: 'white', suffix: '.attack(0.01).decay(0.45).sustain(0).lpf(2500)' },\n          { label: 'sub', snd: 'sine', suffix: '.note(\"c1\").attack(0.01).decay(0.7).sustain(0)' },\n          { label: 'air', snd: 'pink', suffix: '.attack(0.01).decay(0.25).sustain(0).hpf(4500)' }\n        ],\n        params: { gain: 0.45, lpf: 16000, env: 0.2, room: 0.35 }, ranges: R,\n        labels: { gain: 'GAIN', lpf: 'TONE', env: 'RELEASE', room: 'ROOM' }\n      },\n      {\n        id: 'pump', name: 'PUMP', color: '#FF6EC7', kind: 'pump',\n        params: { amount: 0.7, rate: 1, gain: 1, room: 0 },\n        ranges: { amount: [0, 1, 0.05], rate: [0.5, 4, 0.5] },\n        labels: { amount: 'DEPTH', rate: 'PUMPS/BAR' }\n      }\n    ];\n    return this._defs;\n  }\n  get sectionDefs() {\n    return [\n      { id: 'intro', name: 'INTRO', bars: 8 }, { id: 'build', name: 'BUILD', bars: 8 },\n      { id: 'drop', name: 'DROP', bars: 16 }, { id: 'breakdown', name: 'BREAK', bars: 8 }\n    ];\n  }\n  get scaleOpts() { return ['minor', 'major', 'dorian', 'phrygian', 'lydian', 'minor pentatonic', 'harmonic minor']; }\n  get keyOpts() { return ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B']; }\n  def(id) { return this.defs.find(d => d.id === id); }\n  rowCount(d) { return d.kind === 'pump' ? 0 : d.rows.length; }\n\n  // ── state ──────────────────────────────────────────────────────\n  makeInitial() {\n    const layers = {};\n    for (const d of this.defs) layers[d.id] = { params: Object.assign({}, d.params), steps: this.blank(this.rowCount(d)) };\n    const sections = {};\n    for (const s of this.sectionDefs) {\n      sections[s.id] = { bars: s.bars, on: { drums: true, bass: true, lead: true, chords: true, vox: true, arp: true, fx: true, pump: true } };\n    }\n    sections.intro.on = { drums: true, chords: true, pump: true };\n    sections.build.on = { drums: true, bass: true, arp: true, fx: true, pump: true };\n    sections.breakdown.on = { chords: true, vox: true, arp: true, pump: true };\n    return {\n      bpm: 148, keyRoot: 'C', scaleName: 'minor', mode: 'loop', section: 'drop', sel: 'drums',\n      playing: false, step: -1, showCode: false, toast: '', layers, sections,\n      pumpOn: true, pumpTargets: { bass: true, chords: true, vox: false, arp: true, lead: false }\n    };\n  }\n  blank(r      { label: 'HYPERPOP', onClick: () => this.apply('hyperpop'), style: pix('#3A1F7A', '#EDE9FF') },\n        { label: 'PROG HOUSE', onClick: () => this.apply('prog'), style: pix('#3A1F7A', '#EDE9FF') },\n        { label: 'PLUCK', onClick: () => this.apply('pluck'), style: pix('#3A1F7A', '#EDE9FF') },\n        { label: '✦ ROLL DICE', onClick: this.dice, style: pix('#FF6EC7', '#0C0620', true) }\n      ],\n      nudges: [\n        { label: 'HARDER', onClick: () => this.nudge('harder'), style: pix('#2E1B63', '#EDE9FF') },\n        { label: 'DREAMIER', onClick: () => this.nudge('dreamier'), style: pix('#2E1B63', '#EDE9FF') },\n        { label: 'FASTER', onClick: () => this.nudge('faster'), style: pix('#2E1B63', '#EDE9FF') },\n        { label: 'WEIRDER', onClick: () => this.nudge('weirder'), style: pix('#2E1B63', '#EDE9FF') }\n      ],\n\n      sectionTabs: this.sectionDefs.map(s => ({\n        label: s.name, onClick: () => this.mut(next => { next.section = s.id; }),\n        style: 'height:44px;border:3px solid #0C0620;background:' + (st.section === s.id ? '#B8FF5C' : '#3A1F7A') +\n          ';color:' + (st.section === s.id ? '#0C0620' : '#EDE9FF') + ';font-family:\\'Silkscreen\\',monospace;font-size:10px;letter-spacing:0.08em;box-shadow:0 4px 0 #0C0620'\n      })),\n      barsLabel: st.sections[st.section].bars + ' bars',\n      barsDown: () => this.mut(next => { next.sections[next.section].bars = Math.max(2, next.sections[next.section].bars - 2); }),\n      barsUp: () => this.mut(next => { next.sections[next.section].bars = Math.min(32, next.sections[next.section].bars + 2); }),\n      arrangeHint: st.mode === 'loop'\n        ? 'LOOP mode plays only this section. Flip to SONG to hear intro → build → drop → break back to back.'\n        : 'SONG mode plays every section in order for the bars you set.',\n\n      layerChips: this.defs.map(x => {\n        const on = !!st.sections[st.section].on[x.id];\n        const isSel = st.sel === x.id;\n        return {\n          label: x.name, dotMark: on ? '●' : '',\n          wrapStyle: 'display:flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 10px 5px 5px;border:3px solid ' +\n            (isSel ? x.color : '#0C0620') + ';background:' + (isSel ? '#2E1B63' : '#180D3C') + ';box-shadow:0 4px 0 #0C0620',\n          dotStyle: 'width:30px;height:30px;flex-shrink:0;border:2px solid #0C0620;background:' + (on ? x.color : '#120A2E') +\n            ';color:#0C0620;font-size:11px;line-height:1;padding:0;box-shadow:' + (on ? 'inset 0 2px 0 rgba(255,255,255,.45)' : 'none'),\n          nameStyle: 'background:transparent;border:0;padding:2px 0;font-family:\\'Silkscreen\\',monospace;font-size:10px;letter-spacing:0.06em;color:' +\n            (isSel ? '#FFFFFF' : '#9C8DE8'),\n          onSelect: () => this.mut(next => { next.sel = x.id; }, false),\n          onPower: () => this.mut(next => { next.sections[next.section].on[x.id] = !next.sections[next.section].on[x.id]; })\n        };\n      }),\n\n      selName: d.name,\n      selHint: d.kind === 'pump' ? (st.pumpOn ? 'SIDECHAIN ON' : 'SIDECHAIN OFF') : d.kind === 'note' ? 'PITCHES · 16 STEPS' : 'SOUNDS · 16 STEPS',\n      hasGrid: d.kind !== 'pump', isPump: d.kind === 'pump', rows, sliders,\n      stepDots: Array.from({ length: 16 }, (_, i) => ({\n        style: 'height:8px;border:2px solid #0C0620;background:' + (st.playing && st.step === i ? '#FFFFFF' : i % 4 === 0 ? '#6E5AB8' : '#241552')\n      })),\n      pumpTargets: [{ id: 'on', name: 'PUMP ON' }].concat(['bass', 'chords', 'lead', 'arp', 'vox'].map(id => ({ id, name: this.def(id).name })))\n        .map(t => {\n          const active = t.id === 'on' ? st.pumpOn : !!st.pumpTargets[t.id];\n          return {\n            label: t.name,\n            style: 'height:44px;padding:0 12px;border:3px solid #0C0620;background:' + (active ? (t.id === 'on' ? '#FF6EC7' : '#B8FF5C') : '#3A1F7A') +\n              ';color:' + (active ? '#0C0620' : '#EDE9FF') + ';font-family:\\'Silkscreen\\',monospace;font-size:9px;letter-spacing:0.08em;box-shadow:0 4px 0 #0C0620',\n            onClick: () => this.mut(next => {\n              if (t.id === 'on') next.pumpOn = !next.pumpOn; else next.pumpTargets[t.id] = !next.pumpTargets[t.id];\n            })\n          };\n        }),\n\n      showCode: st.showCode, codeCaret: st.showCode ? '▼' : '▶',\n      toggleCode: () => this.setState(p => ({ showCode: !p.showCode })),\n      code: this.buildCode(false),\n      copyCode: this.copyCode, openStrudel: this.openStrudel, shareLink: this.shareLink,\n      resetAll: this.resetAll, toast: st.toast,\n      saveState: 'SAVED ON THIS DEVICE ✦ LOOP FORGE v2'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
