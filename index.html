<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1e21">
<title>StrudelBox</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// Old Loop Forge share links (#s=...) open the archived Loop Forge.
if (/[#&]s=/.test(location.hash)) location.replace('archive/loop-forge/' + location.hash);
</script>
<script src="https://unpkg.com/@strudel/web@1.3.0"></script>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --silk:#7d8088; --ink:#d6d8dd;
  --amber:#ffa94d; --oled:#9ff3ff; --teal:#2ee6c5; --violet:#a78bfa; --pink:#ff6b9a;
  --ease:cubic-bezier(.4,0,.2,1);
  --drawer-w:42vw; --drawer-h:46vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:var(--ui);background:#0b0b0d;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button,select{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- chassis ---------- */
.device{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;
  padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),linear-gradient(180deg,#34363c 0%,#26272b 35%,#1d1e21 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.7);
  transition:margin .32s var(--ease),padding .32s var(--ease)}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9a9da3,#4b4d52 60%,#2a2b2e);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.08)}
.screw::after{content:'';position:absolute;left:2px;right:2px;top:5px;height:1.5px;background:#26272a;transform:rotate(35deg)}
.screw.tl{left:6px;top:6px}.screw.tr{right:6px;top:6px}.screw.bl{left:6px;bottom:6px}.screw.br{right:6px;bottom:6px}
.well{background:linear-gradient(180deg,#121315,#17181b);border-radius:16px;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07)}
.silk{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--silk);white-space:nowrap}
.silk b{color:var(--ink);font-family:var(--mono);font-weight:500;letter-spacing:0;margin-left:4px}

/* ---------- rubber buttons + LEDs ---------- */
.btn{position:relative;border-radius:11px;color:#c9cbd0;background:linear-gradient(180deg,#3d3f45,#2b2c30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.11),inset 0 -1px 2px rgba(0,0,0,.35),0 2px 0 #0d0e10,0 4px 8px rgba(0,0,0,.5);
  transition:transform .06s ease,box-shadow .06s ease,background .15s ease}
.btn:active,.btn.down{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 2px rgba(0,0,0,.35),0 0 0 #0d0e10,0 1px 3px rgba(0,0,0,.5)}
.btn:disabled{opacity:.4}
.led{display:block;width:7px;height:7px;border-radius:50%;background:#2a2523;flex-shrink:0;box-shadow:inset 0 1px 1px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.06);transition:background .12s,box-shadow .12s}
.led.g.on{background:#62ff95;box-shadow:0 0 6px #62ff95,0 0 14px rgba(98,255,149,.5)}
.led.r.on{background:#ff4d4d;box-shadow:0 0 6px #ff4d4d,0 0 14px rgba(255,77,77,.5)}
.led.a.on{background:var(--amber);box-shadow:0 0 6px var(--amber),0 0 14px rgba(255,169,77,.5)}
.led.c.on{background:var(--c);box-shadow:0 0 6px var(--c),0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tb{width:70px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.tb .led{position:absolute;top:7px;right:8px}
.tb svg{width:20px;height:20px;fill:#d6d8dd}
.tb .silk{font-size:8.5px}
.tb.line svg{fill:none;stroke:#d6d8dd;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#play .i-stop{display:none} #play.on .i-play{display:none} #play.on .i-stop{display:block}
.hold .ring{position:absolute;inset:0;width:100%;height:100%;fill:none;pointer-events:none}
.hold .ring rect{stroke:#ff4d4d;stroke-width:2;fill:none;stroke-dasharray:260;stroke-dashoffset:260;transition:stroke-dashoffset .12s linear;filter:drop-shadow(0 0 3px #ff4d4d)}
.hold.charging .ring rect{stroke-dashoffset:0;transition:stroke-dashoffset .7s linear}

.fader{flex:1 1 180px;max-width:300px;display:flex;flex-direction:column;gap:6px}
.fader .silk{display:flex;justify-content:space-between}
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:transparent;touch-action:none;cursor:pointer}
.range::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#0c0d0e;box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08)}
.range::-moz-range-track{height:8px;border-radius:4px;background:#0c0d0e}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:42px;margin-top:-17px;border-radius:6px;
  background:linear-gradient(90deg,transparent 46%,#2b2c2f 46% 54%,transparent 54%),linear-gradient(180deg,#e4e6ea,#a8abb1 45%,#8b8e94 55%,#c4c7cc);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 6px rgba(0,0,0,.6),0 1px 0 #111}
.range::-moz-range-thumb{width:30px;height:42px;border:none;border-radius:6px;background:linear-gradient(180deg,#e4e6ea,#8b8e94)}

/* knobs: LED arc + machined cap */
.kn{display:flex;flex-direction:column;align-items:center;gap:6px}
.knob{--sz:58px;--c:var(--amber);width:var(--sz);height:var(--sz);border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;flex-shrink:0;
  background:conic-gradient(from 225deg,var(--c) 0 var(--a1,0deg),#1b1c1f var(--a1,0deg) 270deg,transparent 270deg);box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.knob.sm{--sz:46px}
.knob .cap{position:absolute;inset:5px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,transparent 58%,rgba(0,0,0,.25) 59% 61%,transparent 62%),
    conic-gradient(from 20deg,#8d9096,#d9dce0,#7c7f85,#c7cacf,#8d9096,#e0e2e6,#7f8288,#cfd2d6,#8d9096);
  box-shadow:0 0 0 2px #121315,0 4px 8px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.6)}
.knob i{position:absolute;left:50%;top:5px;width:3px;height:30%;margin-left:-1.5px;border-radius:2px;background:#1b1c1f;
  transform-origin:50% calc(var(--sz) / 2 - 5px);transform:rotate(var(--r,-135deg))}
.knob.grab .cap{box-shadow:0 0 0 2px #121315,0 2px 4px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.6)}
.kn .silk{font-size:8.5px}

/* OLED */
.lcd{position:relative;flex:1 1 230px;min-width:200px;border-radius:12px;padding:11px 16px;overflow:hidden;font-family:var(--mono);color:var(--oled);
  background:linear-gradient(180deg,#07090a,#040505);
  box-shadow:inset 0 0 0 1px #000,inset 0 3px 10px rgba(0,0,0,.95),0 0 0 5px #17181b,0 0 0 6px rgba(255,255,255,.06);text-shadow:0 0 8px rgba(159,243,255,.45)}
.lcd::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 38%)}
.lcd .r{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.06em;opacity:.8}
.lcd .big{font-size:24px;font-weight:600;letter-spacing:.04em;margin:3px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd .flag{opacity:.18}
.lcd .flag.on{opacity:1;color:#62ff95;text-shadow:0 0 8px rgba(98,255,149,.6)}
.lcd .flag.err{opacity:1;color:#ff6b6b;text-shadow:0 0 8px rgba(255,107,107,.6)}

.pats{display:flex;gap:8px}
.pat{width:54px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:700}
.pat.cur{color:#fff}

/* ---------- lanes ---------- */
.lane{--c:var(--amber);padding:12px 14px 14px}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:12px}
.lname{display:flex;align-items:center;gap:8px;width:72px;flex-shrink:0;color:#9b9ea6;font-weight:700}
.dd{height:48px;min-width:170px;display:flex;align-items:center;padding:0 12px 0 14px;gap:10px}
.dd select{-webkit-appearance:none;appearance:none;flex:1;height:100%;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e9ebef;outline:none;
  position:absolute;inset:0;padding:0 34px 0 32px;width:100%;opacity:1;background:transparent}
.dd .led{position:relative;z-index:1;pointer-events:none}
.dd svg{position:absolute;right:12px;top:50%;margin-top:-6px;width:12px;height:12px;stroke:var(--silk);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mode{height:48px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.mode.key{min-width:62px;justify-content:center;font-family:var(--mono);font-size:14px;letter-spacing:.02em;color:var(--oled);text-shadow:0 0 8px rgba(159,243,255,.45);text-transform:none}
.mode.on{color:#fff}
.knobs{display:flex;gap:14px;margin-left:auto}

.grid{display:grid;grid-template-columns:52px repeat(16,minmax(0,1fr));gap:6px}
.grid + .grid{margin-top:7px}
.rl{height:100%;font-size:10px;font-weight:700;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;gap:6px;color:#9b9ea6}
.rl.tap{color:#e9ebef}
.cell{position:relative;border-radius:9px;background:linear-gradient(180deg,#393b41,#2a2b2f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 2px 0 #0b0c0d,0 3px 6px rgba(0,0,0,.45);transition:background .08s}
.cell.b4{margin-left:8px}
.cell::before{content:'';position:absolute;left:22%;right:22%;top:7px;height:4px;border-radius:2px;background:#1c1a1a;box-shadow:inset 0 1px 1px rgba(0,0,0,.8)}
.cell.q::after{content:'';position:absolute;left:50%;bottom:6px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#5c5f66}
.cell.on::before{background:var(--c);box-shadow:0 0 6px var(--c),0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
.cell.h::before{background:color-mix(in srgb,var(--c) 45%,#1c1a1a);left:-4px;right:-4px}
.cell.ph{background:linear-gradient(180deg,#4a4c53,#36383d)}
.cell.on.ph,.cell.h.ph{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 35%,#4a4c53),color-mix(in srgb,var(--c) 20%,#2d2e33))}
.cell.drag{box-shadow:0 0 0 2px rgba(255,255,255,.55),0 2px 0 #0b0c0d}
.d .cell{height:46px}
.m{touch-action:none}
.m .cell{height:72px}
.m .cell.on,.m .cell.h{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#393b41),color-mix(in srgb,var(--c) 8%,#2a2b2f))}
.cell .pb{position:absolute;left:6px;right:6px;height:4px;border-radius:2px;background:var(--c);top:var(--y,50%);transform:translateY(-50%);display:none;
  box-shadow:0 0 6px var(--c),0 0 12px color-mix(in srgb,var(--c) 45%,transparent)}
.cell.on .pb{display:block}
.cell.h .pb{display:block;left:-8px;right:6px;height:2px;opacity:.6;box-shadow:none}
.cell.b4.h .pb{left:-14px}
.cell .nn{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--c);display:none;white-space:nowrap;text-shadow:0 0 6px color-mix(in srgb,var(--c) 50%,transparent)}
.cell.on .nn{display:block}
.side{display:grid;place-items:center}
.side svg{width:22px;height:22px;stroke:#d6d8dd;fill:none;stroke-width:1.8;stroke-linejoin:round}

/* ---------- popover ---------- */
.panel{border-radius:22px;padding:18px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),linear-gradient(180deg,#34363c,#222327);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.75)}
.pop{position:fixed;z-index:40;display:none}
.pop.open{display:block}
.keys{position:relative;width:308px;height:124px;padding:0}
.wk{position:absolute;bottom:0;width:42px;height:122px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#d9dce0,#b6b9be);box-shadow:inset 0 -5px 0 #8b8e94,0 2px 0 #0d0e10}
.bk{position:absolute;top:0;width:32px;height:74px;border-radius:0 0 7px 7px;z-index:2;background:linear-gradient(180deg,#2b2c30,#1b1c1f);box-shadow:inset 0 -5px 0 #0d0e10,0 3px 6px rgba(0,0,0,.5)}
.wk.on,.bk.on{background:linear-gradient(180deg,#ffd2a1,var(--amber));box-shadow:inset 0 -5px 0 #c97a2c,0 0 18px rgba(255,169,77,.55)}
.prow{display:flex;gap:8px;margin-top:14px}
.prow .mode{flex:1;justify-content:center}
.scrim{position:fixed;inset:0;z-index:39;display:none;background:rgba(4,4,6,.35)}
.scrim.open{display:block}

/* ---------- code drawer ---------- */
.drawer{position:fixed;z-index:30;display:flex;flex-direction:column;gap:12px;padding:14px;transition:transform .32s var(--ease)}
.dhead{display:flex;align-items:center;gap:10px}
.dhead .silk{flex:1;text-align:center}
.sq{width:54px;height:52px;display:flex;align-items:center;justify-content:center}
.sq svg{width:20px;height:20px;stroke:#d6d8dd;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sq .led{position:absolute;top:6px;right:7px}
.ed{position:relative;flex:1;min-height:0;overflow:hidden}
.ed pre,.ed textarea{position:absolute;inset:0;margin:0;padding:16px 16px 40px;font:13px/1.7 var(--mono);white-space:pre;overflow:auto;tab-size:2;border:0;letter-spacing:0;word-spacing:0}
.ed pre{pointer-events:none;color:#c9cbd0}
.ed textarea{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--amber);resize:none;outline:none;-webkit-user-select:text;user-select:text}
.ed textarea::selection{background:rgba(255,169,77,.25)}
.hs{color:var(--amber)} .hc{color:#5d6068;font-style:italic} .hn{color:var(--oled)}
.raw{color:#5d6068;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px);border-radius:4px}
.raw .hs,.raw .hc,.raw .hn{color:inherit}
.derr{font-family:var(--mono);font-size:11px;color:#ff6b6b;text-shadow:0 0 8px rgba(255,107,107,.4);padding:0 4px;min-height:0}
.derr:empty{display:none}

@media (orientation:landscape){
  .drawer{top:0;right:0;bottom:0;width:var(--drawer-w);transform:translateX(104%);border-radius:22px 0 0 22px;padding-top:max(14px,env(safe-area-inset-top))}
  body.code .device{margin-right:var(--drawer-w)}
  body.code .drawer{transform:none}
}
@media (orientation:portrait){
  .drawer{left:0;right:0;bottom:0;height:var(--drawer-h);transform:translateY(104%);border-radius:22px 22px 0 0;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  body.code .device{padding-bottom:calc(var(--drawer-h) + 20px)}
  body.code .drawer{transform:none}
}
@media (max-width:900px){
  .top{gap:12px} .tb{width:62px} .pat{width:48px} .knob{--sz:52px} .knob.sm{--sz:42px} .knobs{gap:10px}
  .dd{min-width:150px} .grid{gap:5px;grid-template-columns:46px repeat(16,minmax(0,1fr))} .cell.b4{margin-left:6px}
}
</style>
</head>
<body>
<div class="device" id="device">
  <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
  <header class="top">
    <button class="btn tb" id="play" aria-label="play"><span class="led g" id="playLed"></span>
      <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      <span class="silk">Play</span></button>
    <button class="btn tb line hold" id="clear" aria-label="clear"><span class="led r"></span>
      <svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6.5 7l.8 11.2A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8L17.5 7M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/></svg>
      <span class="silk">Clear</span>
      <svg class="ring" viewBox="0 0 70 64" preserveAspectRatio="none"><rect x="1" y="1" width="68" height="62" rx="10"/></svg></button>
    <div class="fader"><div class="silk">Tempo<b id="bpmV">150</b></div><input class="range" id="bpm" type="range" min="60" max="180" step="1"></div>
    <div class="kn"><div class="knob" id="swing" role="slider" aria-label="swing"><div class="cap"></div><i></i></div><div class="silk">Swing</div></div>
    <div class="lcd">
      <div class="r"><span id="lcdA">PATTERN A</span><span class="flag" id="lcdFlag">LIVE</span></div>
      <div class="big" id="lcdBig">150 BPM</div>
      <div class="r"><span id="lcdC">TR-909</span><span id="lcdStep">--/16</span></div>
    </div>
    <div class="pats" id="slots"></div>
    <button class="btn tb line" id="codeBtn" aria-label="code"><span class="led a" id="codeLed"></span>
      <svg viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg><span class="silk">Code</span></button>
  </header>
  <main id="lanes" style="display:flex;flex-direction:column;gap:14px"></main>
</div>

<aside class="drawer panel" id="drawer">
  <div class="dhead">
    <button class="btn sq" id="revert" aria-label="revert" disabled><svg viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 0 1 0 10H8M4 9l4-4M4 9l4 4"/></svg></button>
    <span class="silk">Strudel</span>
    <button class="btn sq" id="apply" aria-label="apply" disabled><span class="led a" id="applyLed"></span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
  <div class="ed well">
    <pre id="hl"></pre>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
  </div>
  <div class="derr" id="err"></div>
</aside>

<div class="scrim" id="scrim"></div>
<div class="pop panel" id="rootPop"><div class="keys" id="keys"></div><div class="prow" id="scaleSeg"></div></div>

<script>
/*CORE*/
// ============================================================
//  StrudelBox core: tree <-> Strudel code. Pure functions, no DOM.
// ============================================================
const STEPS = 16;
const MEL = ['bass', 'arp', 'lead'];
const DRUM_ROWS = ['bd', 'sn', 'hh', 'oh'];
const DRUM_TOK = { bd: 'bd', sd: 'sn', cp: 'sn', hh: 'hh', oh: 'oh' };
const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11] };
const SHARP_N = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
const FLAT_N = ['c', 'db', 'd', 'eb', 'e', 'f', 'gb', 'g', 'ab', 'a', 'bb', 'b'];
const FLAT_KEYS = { major: [5, 10, 3, 8, 1, 6], minor: [2, 7, 0, 5, 10, 3] };
const LPF_MAX = 18000, LPF_MIN = 80;
const LANE_RANGE = { bass: [24, 52, 33], arp: [55, 93, 69], lead: [43, 79, 57] };
const DEF_SOUND = { bass: 'sawtooth', arp: 'square', lead: 'gm_pad_halo' };

const mod = (a, n) => ((a % n) + n) % n;

    const c = e.target.closest('.cell'), i = cells.indexOf(c); if (i < 0) return;
    g.setPointerCapture(e.pointerId);
    st = { i, x: e.clientX, y: e.clientY, mode: 'pend', orig: clone(T.lanes[n].steps) };
    c.classList.add('drag');
  });
  g.addEventListener('pointermove', e => {
    if (!st) return;
    const l = T.lanes[n], dx = e.clientX - st.x, dy = e.clientY - st.y, cur = st.orig[st.i];
    if (st.mode === 'pend' && Math.hypot(dx, dy) > 10) st.mode = Array.isArray(cur) ? (Math.abs(dy) > Math.abs(dx) ? 'pitch' : 'tie') : 'none';
    if (st.mode === 'pitch') {
      const [lo, hi] = LANE_RANGE[n];
      let k = Math.round(-dy / 16);
      const at = k => cur.map(m => shiftDia(m, k, l.root, l.scale));
      while (k > 0 && Math.max(...at(k)) > hi + 12) k--;
      while (k < 0 && Math.min(...at(k)) < lo - 12) k++;
      const next = at(k);
      if (JSON.stringify(next) !== JSON.stringify(l.steps[st.i])) {
        l.steps[st.i] = next; l.last = next.slice(); commit();
        lcdShow(chordLabel(next, useFlats(l.root, l.scale)).toUpperCase() + (next.length > 1 ? '' : ''), 900);
      }
    } else if (st.mode === 'tie') {
      const j = idxAt(cells, e.clientX), s2 = clone(st.orig);
      for (let q = st.i + 1; q <= j; q++) s2[q] = 'h';
      if (JSON.stringify(s2) !== JSON.stringify(l.steps)) { l.steps = s2; commit(); }
    }
  });
  const end = () => {
    if (!st) return;
    cells[st.i].classList.remove('drag');
    if (st.mode === 'pend') {
      const l = T.lanes[n], cur = l.steps[st.i];
      if (cur === null) l.steps[st.i] = freshNote(n);
      else { l.steps[st.i] = null; if (Array.isArray(cur)) l.last = cur.slice(); }
      commit();
    }
    st = null;
  };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
}
const PROGS = [[0, 5, 2, 6], [0, 3, 4, 0], [0, 5, 3, 4], [0, 6, 5, 6], [0, 2, 5, 4], [0, 4, 5, 3]];
function diceFill(n) {
  const l = T.lanes[n], [lo, hi, base] = LANE_RANGE[n];
  const prog = PROGS[Math.floor(Math.random() * PROGS.length)];
  const r0 = base + mod(l.root - base + 6, 12) - 6;
  let s = l.steps;
  if (!s.some(Array.isArray)) {
    s = blank();
    for (let b = 0; b < 4; b++) {
      if (n === 'bass') [1, 2, 3].forEach(k => s[b * 4 + k] = [0]);
      else if (n === 'arp') [0, 1, 2, 3].forEach(k => s[b * 4 + k] = [0]);
      else { s[b * 4] = [0]; s[b * 4 + 1] = s[b * 4 + 2] = s[b * 4 + 3] = 'h'; }
    }
  }
  let k = 0;
  l.steps = s.map((t, i) => {
    if (!Array.isArray(t)) return t;
    const croot = shiftDia(r0, prog[Math.floor(i / 4)], l.root, l.scale), tri = triad(croot, l.root, l.scale);
    let out;
    if (l.chord) out = tri;
    else if (n === 'bass') out = [croot + (k % 3 === 1 ? 12 : 0)];
    else if (n === 'arp') out = [shiftDia(croot, [0, 2, 4, 7][i % 4], l.root, l.scale)];
    else out = [tri[Math.floor(Math.random() * 3)]];
    k++;
    return out.map(m => clamp(m, lo - 12, hi + 12));
  });
  l.last = null;
}

// ---------- key popover ----------
let rootLane = null;
const $pop = $('rootPop'), $scrim = $('scrim'), $keys = $('keys'), $scaleSeg = $('scaleSeg');
[0, 2, 4, 5, 7, 9, 11].forEach((pc, i) => { const k = el('button', 'wk'); k.style.left = i * 44 + 'px'; k.dataset.pc = pc; $keys.append(k); });
Object.entries({ 1: 0, 3: 1, 6: 3, 8: 4, 10: 5 }).forEach(([pc, i]) => { const k = el('button', 'bk'); k.style.left = i * 44 + 28 + 'px'; k.dataset.pc = pc; $keys.append(k); });
['minor', 'major'].forEach(sc => { const b = el('button', 'btn mode', `<span class="led a"></span>${sc}`); b.dataset.sc = sc; $scaleSeg.append(b); });
function remapLane(l, root, scale) {
  const delta = mod(root - l.root + 6, 12) - 6, r1 = l.root + delta;
  const f = m => { const d = toDeg(m, l.root, l.scale); return fromDeg(d.deg, d.acc, r1, scale); };
  l.steps = l.steps.map(t => Array.isArray(t) ? t.map(f) : t);
  if (l.last) l.last = l.last.map(f);
  l.root = mod(root, 12); l.scale = scale;
}
const keyName = l => { const r = (useFlats(l.root, l.scale) ? FLAT_N : SHARP_N)[l.root]; return r[0].toUpperCase() + r.slice(1); };
function openRoot(n, anchor) {
  rootLane = n; paintPop();
  $pop.style.setProperty('--c', LANE_COLOR[n]);
  const r = anchor.getBoundingClientRect();
  $pop.classList.add('open'); $scrim.classList.add('open');
  const w = $pop.offsetWidth, h = $pop.offsetHeight;
  $pop.style.left = clamp(r.left, 12, innerWidth - w - 12) + 'px';
  $pop.style.top = (r.bottom + 10 + h > innerHeight ? r.top - h - 10 : r.bottom + 10) + 'px';
}
function paintPop() {
  const l = T.lanes[rootLane];
  $keys.querySelectorAll('button').forEach(k => k.classList.toggle('on', +k.dataset.pc === l.root));
  $scaleSeg.querySelectorAll('button').forEach(b => { const on = b.dataset.sc === l.scale; b.classList.toggle('on', on); b.firstChild.classList.toggle('on', on); });
  lcdShow(rootLane.toUpperCase() + ' ' + keyName(l).toUpperCase() + ' ' + l.scale.toUpperCase());
}
$keys.addEventListener('click', e => { const k = e.target.closest('button'); if (!k) return; const l = T.lanes[rootLane]; remapLane(l, +k.dataset.pc, l.scale); commit(); paintPop(); });
$scaleSeg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const l = T.lanes[rootLane]; remapLane(l, l.root, b.dataset.sc); commit(); paintPop(); });
$scrim.addEventListener('click', () => { $pop.classList.remove('open'); $scrim.classList.remove('open'); });

// ---------- paint ----------
function paintTransport() {
  $('play').classList.toggle('on', playing);
  $('playLed').classList.toggle('on', playing);
  $('lcdFlag').classList.toggle('on', playing);
  if (!playing) $('lcdStep').textContent = '--/16';
}
function paint() {
  $('bpmV').textContent = Math.round(T.bpm); $('bpm').value = clamp(T.bpm, 60, 180);
  $('lcdA').textContent = 'PATTERN ' + store.slot;
  $('lcdC').textContent = bankLabel(T.drums.bank).toUpperCase();
  if (!lcdT) lcdIdle();
  UI.knobs.forEach(r => r());
  const D = T.drums;
  ensureOption(UI.drums.sel, D.bank, D.bank || 'Default'); UI.drums.sel.value = D.bank;
  DRUM_ROWS.forEach(r => UI.drums.rows[r].cells.forEach((c, i) => c.classList.toggle('on', !!D.rows[r][i])));
  UI.drums.rows.sn.lab.textContent = D.snare.toUpperCase();
  MEL.forEach(n => {
    const l = T.lanes[n], u = UI.mel[n], [lo, hi] = LANE_RANGE[n], fl = useFlats(l.root, l.scale);
    ensureOption(u.sel, l.sound, l.sound); u.sel.value = l.sound;
    u.key.textContent = keyName(l) + (l.scale === 'minor' ? 'm' : '');
    u.chord.classList.toggle('on', l.chord); u.chord.firstChild.classList.toggle('on', l.chord);
    let lastY = 50;
    u.cells.forEach((c, i) => {
      const t = l.steps[i];
      c.classList.toggle('on', Array.isArray(t)); c.classList.toggle('h', t === 'h');
      if (Array.isArray(t)) { lastY = clamp((1 - (t[0] - lo) / (hi - lo)) * 100, 32, 66); c.lastChild.textContent = chordLabel(t, fl); }
      if (t !== null) c.style.setProperty('--y', lastY + '%');
    });
  });
  document.querySelectorAll('.pat').forEach(b => {
    const cur = b.dataset.s === store.slot;
    b.classList.toggle('cur', cur);
    b.firstChild.className = 'led ' + (cur ? 'a on' : store.slots[b.dataset.s] ? 'g' : '');
  });
}

// ---------- playhead ----------
let phStep = -1;
function clearPh() { document.querySelectorAll('.cell.ph').forEach(c => c.classList.remove('ph')); phStep = -1; }
function tick() {
  if (playing && repl?.scheduler) {
    let now = 0; try { now = repl.scheduler.now(); } catch (e) {}
    const st = Math.floor(mod(now, 1) * STEPS);
    if (st !== phStep && isFinite(st)) {
      clearPh(); phStep = st;
      DRUM_ROWS.forEach(r => UI.drums.rows[r].cells[st].classList.add('ph'));
      MEL.forEach(n => UI.mel[n].cells[st].classList.add('ph'));
      $('lcdStep').textContent = String(st + 1).padStart(2, '0') + '/16';
    }
  }
  requestAnimationFrame(tick);
}

// ---------- code drawer ----------
const $code = $('code'), $hl = $('hl'), $apply = $('apply'), $revert = $('revert'), $err = $('err');
let dirty = false;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hiCode(s) {
  return s.replace(/(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`]*`)|(\b\d+\.?\d*\b)|([^"'`/\d]+|.)/g, (m, c, str, num) =>
    c ? `<span class="hc">${esc(c)}</span>` : str ? `<span class="hs">${esc(str)}</span>` : num ? `<span class="hn">${esc(num)}</span>` : esc(m));
}
function renderCode() {
  const segs = generate(T);
  $code.value = segs.map(s => s.t).join('');
  $hl.innerHTML = segs.map(s => s.k === 'r' ? `<span class="raw">${esc(s.t)}</span>` : s.k === 'm' ? `<span class="hc">${esc(s.t)}</span>` : hiCode(s.t)).join('') + '\n ';
  syncScroll();
}
function setDirty(v) { dirty = v; $apply.disabled = !v; $revert.disabled = !v; $('applyLed').classList.toggle('on', v); }
function syncScroll() { $hl.scrollTop = $code.scrollTop; $hl.scrollLeft = $code.scrollLeft; }
$code.addEventListener('input', () => { setDirty(true); $hl.innerHTML = hiCode($code.value) + '\n '; syncScroll(); });
$code.addEventListener('scroll', syncScroll);
$code.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); applyCode(); }
});
function applyCode() { T = parseCode($code.value, T); setDirty(false); lcdShow('CODE APPLIED'); commit(); }
$apply.addEventListener('click', applyCode);
$revert.addEventListener('click', () => { setDirty(false); renderCode(); });
function showErr(msg) {
  $err.textContent = msg || '';
  const f = $('lcdFlag'); f.classList.toggle('err', !!msg); f.textContent = msg ? 'ERR' : 'LIVE';
}
$('codeBtn').addEventListener('click', () => { const o = document.body.classList.toggle('code'); $('codeLed').classList.toggle('on', o); });

// ---------- header controls ----------
$('play').addEventListener('click', () => playing ? stop() : play());
$('bpm').addEventListener('input', e => { T.bpm = +e.target.value; lcdShow(T.bpm + ' BPM'); commit(); });
['A', 'B', 'C', 'D'].forEach(s => {
  const b = el('button', 'btn pat', `<span class="led"></span>${s}`); b.dataset.s = s;
  b.addEventListener('click', () => {
    if (s === store.slot) return;
    store.slots[store.slot] = T; store.slot = s;
    T = store.slots[s] || emptyTree(T.bpm); store.slots[s] = T;
    setDirty(false); lcdShow('PATTERN ' + s); commit();
  });
  $('slots').append(b);
});
(() => {
  const b = $('clear'); let t = 0;
  const cancel = () => { clearTimeout(t); b.classList.remove('charging'); };
  b.addEventListener('pointerdown', () => {
    b.classList.add('charging');
    t = setTimeout(() => { cancel(); T = emptyTree(T.bpm); setDirty(false); lcdShow('CLEARED'); commit(); }, 700);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, cancel));
})();
document.addEventListener('keydown', e => { if (e.code === 'Space' && document.activeElement !== $code && document.activeElement?.tagName !== 'SELECT') { e.preventDefault(); playing ? stop() : play(); } });

// ---------- go ----------
buildLanes(); renderCode(); paint(); paintTransport();
boot();
requestAnimationFrame(tick);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
